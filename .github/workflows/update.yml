name: 更新基金日记

on:
  schedule:
    # GitHub 使用 UTC：14:13 UTC = 北京时间 22:13（复盘 + 预测下一交易日）
    - cron: '13 14 * * *'
    # 00:07 UTC = 北京时间 08:07，周一至周五（用隔夜美股定稿当日预测）
    - cron: '7 0 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'evening=复盘+预测下一交易日；morning=开盘前定稿'
        required: false
        default: 'evening'
        type: choice
        options: [evening, morning]

permissions:
  contents: write

concurrency:
  group: update-diary
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 抓净值、复盘、预测
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 0 * * 1-5' && 'morning') || 'evening' }}
        run: node scripts/update.mjs
      - name: 提交更新
        run: |
          git config user.name "fund-diary-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "数据无变化"; exit 0; fi
          git commit -m "更新基金日记 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
