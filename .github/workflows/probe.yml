name: probe
on:
  push:
    paths: ['probe/probe.mjs']
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe/probe.mjs
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe/result.json probe/out; git commit -m "probe result"; git pull --rebase; git push
