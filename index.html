<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>基金日记</title>
<meta name="theme-color" content="#F3F5F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="基金日记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
/* 布局：手机优先的三标签 app——预测（养基宝式清单）/ 成绩（记分卡）/ 实验室（信号卡）。A股惯例红涨绿跌 */
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#1A2233; --sub:#5A6478; --line:#E6EAF0; --soft:#EEF1F6;
  --accent:#2F55D4; --accent-soft:#E8EEFC;
  --up:#C8322B; --up-soft:#FBE9E7; --down:#1E7A47; --down-soft:#E3F1E8; --mid:#8A6A12;
  --good:#1F7A70; --bad:#9A5B2E; --track:#DDE2EA;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-head:"Songti SC","Noto Serif SC","STSong",serif;
  --f-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --card:#1A2029; --ink:#E6EAF2; --sub:#9AA3B5; --line:#2A3240; --soft:#222A36;
  --accent:#8FAAF5; --accent-soft:#1F2A44;
  --up:#FF6E62; --up-soft:#3A1F1D; --down:#4FC07E; --down-soft:#173024; --mid:#D9B65A;
  --good:#4FC1B4; --bad:#D99A6A; --track:#2E3746; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --card:#1A2029; --ink:#E6EAF2; --sub:#9AA3B5; --line:#2A3240; --soft:#222A36;
  --accent:#8FAAF5; --accent-soft:#1F2A44;
  --up:#FF6E62; --up-soft:#3A1F1D; --down:#4FC07E; --down-soft:#173024; --mid:#D9B65A;
  --good:#4FC1B4; --bad:#D99A6A; --track:#2E3746; color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:16px 14px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)} .small{font-size:12px} .tiny{font-size:11px}
.up{color:var(--up)} .down{color:var(--down)} .mid{color:var(--mid)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.top h1{font-family:var(--f-head);font-size:24px;margin:0;line-height:1.2}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.card{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{flex:1;border:none;background:transparent;padding:7px 0;border-radius:8px;font-size:14px;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.big{font-family:var(--f-num);font-size:34px;font-weight:600;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--down-soft);overflow:hidden;display:flex}
.bar i{display:block;background:var(--up)}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.lh,.lr{display:grid;grid-template-columns:minmax(0,1fr) 62px 100px;gap:8px;padding:11px 16px;align-items:center}
.lh{font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);padding-block:8px}
.lr{border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.lr:last-child{border-bottom:none}
.lr .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .why{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .p{font-family:var(--f-num);font-size:18px;font-weight:600;text-align:right}
.lr .rg{font-family:var(--f-num);font-size:12.5px;color:var(--sub);text-align:right}
.det{padding:4px 16px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:6px;background:var(--soft)}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px}
.kv span b{font-family:var(--f-num);font-weight:600}
.strip{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabbar button{border:none;background:none;padding:8px 0;font-size:13px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px}
.verdict{font-size:17px;font-weight:700;line-height:1.4}
.rowbar{display:grid;grid-template-columns:92px minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13px}
.track{position:relative;height:12px;background:var(--track);border-radius:6px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.track .half{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1.5px dashed var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--sub);font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num)}
.tbl tr:last-child td{border-bottom:none}
.hit{color:var(--accent);font-weight:700} .miss{color:var(--sub);font-weight:700}
.sig{background:var(--card);border-radius:14px;padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.sig .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sig .h b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-act{background:var(--ink);color:var(--card)} .c-sh{border:1px solid var(--sub);color:var(--sub)}
.v-good{color:var(--good)} .v-bad{color:var(--bad)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;align-items:center}
.ci .t{position:relative;height:14px}
.ci .t .base{position:absolute;left:0;right:0;top:6px;height:2px;background:var(--track)}
.ci .t .fifty{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--sub)}
.ci .t .rng{position:absolute;top:4px;height:6px;border-radius:3px}
.ci .t .dot{position:absolute;top:1px;width:12px;height:12px;margin-left:-6px;border-radius:6px}
.dark{background:var(--ink);color:var(--card)}
.dark .sub{color:var(--card);opacity:.75}
details.fold summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-weight:600;font-size:14px}
details.fold summary::-webkit-details-marker{display:none}
.empty{color:var(--sub);text-align:center;padding:22px 12px;background:var(--card);border-radius:14px;font-size:14px}
.foot{font-size:11.5px;color:var(--sub);line-height:1.6;padding:0 4px}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <section id="v-pred"></section>
  <section id="v-score" hidden></section>
  <section id="v-lab" hidden></section>
  <p class="foot" id="foot"></p>
</main>
<nav class="tabbar" role="tablist" aria-label="主导航"><div>
  <button role="tab" data-v="pred" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>预测</button>
  <button role="tab" data-v="score" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>成绩</button>
  <button role="tab" data-v="lab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg>实验室</button>
</div></nav>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt=v=>v==null||isNaN(v)?"–":(v>0?"+":"")+Number(v).toFixed(2)+"%";
  const P=x=>x&&x.p!=null?x.p:null;
  const pTxt=p=>p==null?"–":Math.round(p*100)+"%";
  const pCls=p=>p==null?"sub":p>0.52?"up":p<0.48?"down":"mid";
  const aCls=v=>v==null?"sub":v>0?"up":v<0?"down":"mid";
  const hitOf=(p,a)=>p==null||a==null||a===0||p===0.5?null:((p>0.5)===(a>0));
  const WD="日一二三四五六";
  const dlabel=d=>{const t=new Date(d+"T00:00:00Z");return (t.getUTCMonth()+1)+"月"+t.getUTCDate()+"日 周"+WD[t.getUTCDay()]};
  const NAMES={mix:"综合",rule:"规则模型",ai:"AI 判断",base_us:"跟随外盘",base_up:"全猜涨",base_prev:"昨日延续",base_coin:"抛硬币"};
  let D=null, predView="today", scoreView="live", open={};

  // ---------- 预测 ----------
  function renderPred(){
    const days=Object.values(D.rec.days).filter(d=>d.format===2);
    const pend=days.filter(d=>d.status==="pending").sort((a,b)=>a.date.localeCompare(b.date))[0];
    const last=days.filter(d=>d.status==="reviewed").sort((a,b)=>b.date.localeCompare(a.date))[0];
    const d=predView==="today"?pend:last;
    let h='<div class="top"><div><div class="sub small">'+(d?esc(dlabel(d.date))+(d.features&&d.features.c.gap>=4?' · 节后首日':''):'')+'</div><h1>'+(predView==="today"?"今日预测":"昨日结果")+'</h1></div>';
    if(d&&predView==="today")h+='<span class="pill">'+(d.lockedAt?'已锁定 '+esc(String(d.lockedAt).slice(11,16)):'晚间草稿 · 8:07 定稿')+'</span>';
    h+='</div><div class="seg"><button data-pv="today" aria-pressed="'+(predView==="today")+'">今日预测</button><button data-pv="last" aria-pressed="'+(predView==="last")+'">昨日结果</button></div>';
    if(!d){h+='<div class="empty">'+(predView==="today"?"暂无待验证的预测，下一个交易日前一晚 22:13 自动生成。":"还没有复盘过的交易日，节后首日收盘后出第一份结果。")+'</div>';$("v-pred").innerHTML=h+holdings();bindPred();return}
    const codes=D.funds.map(f=>f.code);
    const mixP=c=>P(d.preds.mix&&d.preds.mix[c]);
    // 科技仓整体
    const techP=d.tech&&d.tech.p!=null?d.tech.p:(()=>{const xs=codes.map(mixP).filter(x=>x!=null);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null})();
    if(predView==="today"){
      h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">科技仓整体</b><span class="sub small">五只基金同向性很强</span></div>'+
        '<div style="display:flex;align-items:baseline;gap:8px"><span class="big '+pCls(techP)+'">'+pTxt(techP)+'</span><span class="sub small">上涨概率</span></div>'+
        '<div class="bar" aria-hidden="true"><i style="width:'+(techP==null?50:Math.round(techP*100))+'%"></i></div>'+
        '<span style="font-size:13px;line-height:1.6">'+esc((d.tech&&d.tech.basis)||d.market||"")+'</span>'+(d.tech&&d.tech.basis&&d.market?'<span class="sub small" style="line-height:1.6">'+esc(d.market)+'</span>':'')+'</div>';
    }else{
      let n=0,hit=0,bs=0;codes.forEach(c=>{const p=mixP(c),a=d.actual&&d.actual[c];if(p==null||a==null||a===0)return;bs+=(p-(a>0?1:0))**2;n++;const x=hitOf(p,a);if(x)hit++});
      h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">当日成绩</b><span class="sub small">综合预测</span></div>'+
        '<div style="display:flex;gap:22px;align-items:baseline"><span><span class="big">'+hit+'/'+n+'</span> <span class="sub small">方向命中</span></span><span><span class="num" style="font-size:20px;font-weight:600">'+(n?(bs/n).toFixed(3):"–")+'</span> <span class="sub small">Brier（抛硬币 0.250）</span></span></div>'+
        (d.review&&d.review.summary?'<span style="font-size:13px;line-height:1.6">'+esc(d.review.summary)+'</span>':'')+'</div>';
    }
    // 清单
    h+='<div class="list"><div class="lh"><span>基金</span><span style="text-align:right">涨的概率</span><span style="text-align:right">'+(predView==="today"?"预计区间":"实际")+'</span></div>';
    const rname=id=>{const r=D.strat.rules.find(x=>x.id===id);return r?r.name:id};
    D.funds.forEach(f=>{
      const c=f.code,p=mixP(c),r=d.preds.rule&&d.preds.rule[c],ai=d.preds.ai&&d.preds.ai[c],a=d.actual&&d.actual[c];
      const act=(r&&r.fired||[]).filter(id=>{const x=D.strat.rules.find(y=>y.id===id);return x&&x.status==="active"});
      const why=act.length?act.map(rname).join("；"):(ai&&ai.basis)||"无明显信号";
      const rg=ai&&ai.low!=null?fmt(ai.low).replace("%","")+" ~ "+fmt(ai.high):(r?fmt(r.low).replace("%","")+" ~ "+fmt(r.high):"–");
      const right=predView==="today"?'<span class="rg">'+rg+'</span>':'<span class="rg"><span class="'+aCls(a)+'" style="font-weight:600">'+fmt(a)+'</span> '+(hitOf(p,a)==null?'':hitOf(p,a)?'<span class="hit">✓</span>':'<span class="miss">✗</span>')+'</span>';
      const key=d.date+c;
      h+='<button class="lr" data-k="'+key+'" aria-expanded="'+!!open[key]+'"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="nm">'+esc(f.short)+'</span><span class="why">'+esc(why)+'</span></span><span class="p '+pCls(p)+'">'+pTxt(p)+'</span>'+right+'</button>';
      if(open[key]){
        const ff=d.features&&d.features.f[c]||{};
        h+='<div class="det"><div class="kv"><span>规则 <b class="'+pCls(P(r))+'">'+pTxt(P(r))+'</b></span><span>AI <b class="'+pCls(P(ai))+'">'+pTxt(P(ai))+'</b></span><span>跟随外盘 <b>'+pTxt(P(d.preds.base_us&&d.preds.base_us[c]))+'</b></span>'+(d.predsEvening&&d.predsEvening.mix?'<span>晚间版 <b>'+pTxt(P(d.predsEvening.mix[c]))+'</b></span>':'')+'</div>'+
          '<div class="kv sub"><span>上一日 '+fmt(ff.prev)+'</span><span>近5日 '+fmt(ff.mom5)+'</span><span>锚定指数 '+fmt(ff.anc)+'</span><span>波动 '+(ff.vol20!=null?ff.vol20.toFixed(2)+'%':'–')+'</span></div>'+
          (r&&r.fired&&r.fired.length?'<div class="sub">触发：'+r.fired.map(id=>{const x=D.strat.rules.find(y=>y.id===id);return esc(id+(x&&x.status==="shadow"?"(观察)":"")+" "+(x?x.name:""))}).join("；")+'</div>':'')+
          (ai&&ai.basis?'<div>AI：'+esc(ai.basis)+'</div>':'')+'</div>';
      }
    });
    h+='</div>';
    const roll=D.stats&&D.stats.rolling||[];const L=roll.slice(-20);
    h+='<div class="card strip"><span>实盘累计（综合）</span><span class="num">'+(roll.length?('命中 '+(roll.at(-1).mix??"–")+'% · Brier '+(roll.at(-1).mix_brier??"–")):'节后开始积累')+'</span></div>';
    if(d.guxia)h+='<div class="card" style="gap:4px"><b style="font-size:13px">天津股侠（观察中）</b><span class="sub small" style="line-height:1.6">立场 '+(d.guxia.stance==null?'无':d.guxia.stance>0?'偏多':d.guxia.stance<0?'偏空':'中性')+'：'+esc(d.guxia.summary||"")+'</span></div>';
    $("v-pred").innerHTML=h+holdings();
    bindPred();
  }
  function holdings(){
    const t=D.funds.reduce((s,f)=>s+(+f.amount||0),0),pn=D.funds.reduce((s,f)=>s+(+f.pnl||0),0);
    return '<details class="card fold"><summary><span>持仓 ¥'+t.toFixed(2)+'</span><span class="'+aCls(pn)+' num">'+pn.toFixed(2)+'</span></summary><table class="tbl"><thead><tr><th>基金</th><th>金额</th><th>持有收益</th></tr></thead><tbody>'+
      D.funds.map(f=>'<tr><td style="font-family:var(--f-body)">'+esc(f.short)+'</td><td>'+Number(f.amount).toFixed(2)+'</td><td class="'+aCls(f.pnl)+'">'+Number(f.pnl).toFixed(2)+' ('+fmt(f.pnlPct)+')</td></tr>').join('')+
      '</tbody></table><span class="sub tiny">按每日净值自动滚动，截至各基金最新净值日；加减仓后需在仓库里修改。</span></details>';
  }
  function bindPred(){
    document.querySelectorAll("[data-pv]").forEach(b=>b.addEventListener("click",()=>{predView=b.dataset.pv;renderPred()}));
    document.querySelectorAll(".lr").forEach(b=>b.addEventListener("click",()=>{open[b.dataset.k]=!open[b.dataset.k];renderPred()}));
  }

  // ---------- 成绩 ----------
  function renderScore(){
    const S=D.stats; if(!S){$("v-score").innerHTML='<div class="empty">暂无统计</div>';return}
    const live=scoreView==="live", Pp=S.predictors;
    const g=k=>Pp[k]&&(live?Pp[k].live:Pp[k].backtest);
    const main=live?"mix":"rule", M=g(main);
    let h='<div class="top"><div><div class="sub small">'+(live?'实盘 · 节后起每个交易日 5 次':'回测 · 最近约 120 个交易日 · 规则 v'+esc(S.strategyVersion))+'</div><h1>成绩单</h1></div></div>';
    h+='<div class="seg"><button data-sv="live" aria-pressed="'+live+'">实盘</button><button data-sv="bt" aria-pressed="'+!live+'">回测</button></div>';
    // 结论
    let vt,vs;
    if(!M||!M.bn){vt="还没有数据";vs="节后首个交易日收盘后开始记录。"}
    else{
      const sk=M.brier!=null?(1-M.brier/0.25)*100:null, bb=M.vsBestBrier;
      if(M.bn<100){vt="样本太少，先不下结论";vs="已有 "+M.bn+" 次判断。Brier "+M.brier+"（抛硬币 0.250，最好的笨办法 "+(bb??"–")+"）。至少攒到 100 次再看。"}
      else if(M.brier<(bb??0.25)-0.005&&M.p!=null&&M.p<0.05){vt="有迹象可以预测";vs=NAMES[main]+"的 Brier "+M.brier+"，好于最好的笨办法 "+bb+"；方向命中 "+M.rate+"%，是运气的概率约 "+Math.round(M.p*100)+"%。"}
      else{vt="还不能证明可预测";vs=NAMES[main]+"的 Brier "+M.brier+"，最好的笨办法 "+(bb??"–")+"，抛硬币 0.250；方向命中 "+M.rate+"%，比笨办法高出的部分是运气的概率约 "+(M.p!=null?Math.round(M.p*100):"–")+"%。"}
    }
    h+='<div class="card"><span class="sub small">结论</span><span class="verdict">'+esc(vt)+'</span><span style="font-size:13px;line-height:1.6">'+esc(vs)+'</span></div>';
    // 命中率条
    const keys=live?["mix","rule","ai","base_us","base_up"]:["rule","base_us","base_up","base_prev"];
    h+='<div class="card"><b style="font-size:14px">方向命中率 <span class="sub small" style="font-weight:400">虚线为 50%</span></b>';
    keys.forEach(k=>{const s=g(k);const r=s&&s.rate;const mine=["mix","rule","ai"].includes(k);
      h+='<div class="rowbar"><span>'+NAMES[k]+'</span><div class="track"><div class="fill" style="width:'+(r||0)+'%;background:'+(mine?'var(--accent)':'var(--sub)')+';opacity:'+(mine?1:.45)+'"></div><div class="half"></div></div><span class="num" style="text-align:right;font-weight:600">'+(r!=null?r.toFixed(1)+'%':'–')+'</span></div>'});
    h+='<table class="tbl" style="margin-top:4px"><thead><tr><th>预测方</th><th>Brier</th><th>判断次数</th></tr></thead><tbody>'+
      [...keys,"base_coin"].map(k=>{const s=g(k);return '<tr><td style="font-family:var(--f-body)">'+NAMES[k]+'</td><td>'+(s&&s.brier!=null?s.brier.toFixed(3):'–')+'</td><td>'+(s?s.bn:'–')+'</td></tr>'}).join('')+
      '</tbody></table><span class="sub tiny" style="line-height:1.6">Brier＝(涨的概率−实际)² 的平均，越低越好；每次都说 50% 就是 0.250。笨办法的概率按历史数据换算。</span></div>';
    // 校准
    const cal=(S.calibration&&(live?S.calibration.live:S.calibration.backtest))||[];
    h+='<div class="card"><b style="font-size:14px">校准：说 60% 的时候，真涨了 60% 吗？</b><span class="sub tiny">'+NAMES[main]+'</span><table class="tbl"><thead><tr><th>预测概率</th><th>次数</th><th>平均预测</th><th>实际涨</th></tr></thead><tbody>'+
      cal.map(b=>{const dv=b.n?b.upRate-b.avgP:null;return '<tr><td>'+esc(b.label)+'</td><td>'+b.n+'</td><td>'+(b.avgP!=null?b.avgP.toFixed(0)+'%':'–')+'</td><td class="'+(dv==null?'':Math.abs(dv)>10?'v-bad':'')+'">'+(b.upRate!=null?b.upRate.toFixed(0)+'%':'–')+'</td></tr>'}).join('')+
      '</tbody></table><span class="sub tiny">两列越接近越好；相差超过 10 个百分点标橙色，说明过度自信或过度保守。</span></div>';
    // 流水账
    if(live){
      const rows=[];Object.values(D.rec.days).filter(d=>d.format===2&&d.status==="reviewed").sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).forEach(d=>D.funds.forEach(f=>{const p=P(d.preds.mix&&d.preds.mix[f.code]),a=d.actual&&d.actual[f.code];rows.push({d:d.date,f:f.short,p,a,lock:d.lockedAt})}));
      h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">流水账</b><a class="small" href="data/records.csv" target="_blank" rel="noopener">下载全部 CSV</a></div>';
      h+=rows.length?'<table class="tbl"><thead><tr><th>日期</th><th style="text-align:left">基金</th><th>涨的概率</th><th>实际</th><th></th></tr></thead><tbody>'+rows.map(r=>{const x=hitOf(r.p,r.a);return '<tr><td>'+esc(r.d.slice(5))+'</td><td style="text-align:left;font-family:var(--f-body)">'+esc(r.f)+'</td><td>'+pTxt(r.p)+'</td><td class="'+aCls(r.a)+'">'+fmt(r.a)+'</td><td>'+(x==null?'':x?'<span class="hit">✓</span>':'<span class="miss">✗</span>')+'</td></tr>'}).join('')+'</tbody></table><span class="sub tiny">每条预测在开盘前锁定，带时间戳，事后不能修改。</span>':'<span class="sub small">节后首日收盘后出现第一行。</span>';
      h+='</div>';
    }
    $("v-score").innerHTML=h;
    document.querySelectorAll("[data-sv]").forEach(b=>b.addEventListener("click",()=>{scoreView=b.dataset.sv;renderScore()}));
  }

  // ---------- 实验室 ----------
  function renderLab(){
    const st=D.strat,S=D.stats; const sc=id=>(S&&S.rules.find(r=>r.id===id))||{n:0};
    const lastCh=st.changelog[st.changelog.length-1];
    const lastRev=Object.values(D.rec.days).filter(d=>d.format===2&&d.review&&d.review.summary).sort((a,b)=>b.date.localeCompare(a.date))[0];
    let h='<div class="top"><div><div class="sub small">预测逻辑 v'+st.version+' · '+st.rules.length+' 条信号 · 每日复盘修正</div><h1>信号实验室</h1></div></div>';
    const good=st.rules.map(r=>({r,s:sc(r.id)})).filter(x=>x.s.verdict==="有效").sort((a,b)=>b.s.lo-a.s.lo)[0];
    const bad=st.rules.map(r=>({r,s:sc(r.id)})).filter(x=>x.s.verdict==="反向/无效"&&x.r.status==="active");
    h+='<div class="card dark"><span class="sub small">最近一次体检</span>'+
      (good?'<span style="font-size:15px;line-height:1.55"><b>最有用：</b>'+esc(good.r.name)+'（'+good.s.rate+'%，'+good.s.n+' 次）</span>':'')+
      (bad.length?'<span style="font-size:15px;line-height:1.55"><b>拖后腿：</b>'+bad.map(x=>esc(x.r.name)+'（'+x.s.rate+'%）').join('；')+'</span>':'<span style="font-size:15px">正式规则里没有明显拖后腿的。</span>')+
      (lastRev?'<span class="sub small" style="line-height:1.6">'+esc(lastRev.date.slice(5))+' 复盘：'+esc(lastRev.review.summary)+'</span>':'')+
      (lastCh?'<span class="sub small">v'+lastCh.version+'（'+esc(lastCh.date)+'）：'+esc(lastCh.changes)+(lastCh.brierBefore!=null?'；Brier '+lastCh.brierBefore+' → '+lastCh.brierAfter:'')+'</span>':'')+'</div>';
    h+='<div class="strip sub small" style="padding:0 4px"><span>触发后命中率 · 横线为 95% 区间</span><span>虚线 50%</span></div>';
    const pos=v=>((Math.max(20,Math.min(90,v))-20)/70*100);
    const ordered=[...st.rules].sort((a,b)=>{const o={"有效":0,"不确定":1,"反向/无效":2,"样本不足":3};return (o[sc(a.id).verdict]-o[sc(b.id).verdict])||(a.status==="active"?-1:1)});
    ordered.forEach(r=>{
      const s=sc(r.id);const thin=s.n<20;
      const col=thin?'var(--track)':s.verdict==="有效"?'var(--good)':s.verdict==="反向/无效"?'var(--bad)':'var(--sub)';
      h+='<div class="sig"><div class="h"><b>'+esc(r.id+" "+r.name)+'</b><span class="chip '+(r.status==="active"?'c-act':'c-sh')+'">'+(r.status==="active"?'正式':'观察')+'</span></div>'+
        '<div class="ci"><div class="t" aria-hidden="true"><div class="base"></div><div class="fifty" style="left:'+pos(50)+'%"></div>'+
        (s.n?'<div class="rng" style="left:'+pos(s.lo)+'%;width:'+(pos(s.hi)-pos(s.lo))+'%;background:'+col+'"></div><div class="dot" style="left:'+pos(s.rate)+'%;background:'+(thin?'var(--sub)':col)+'"></div>':'')+
        '</div><span class="num small" style="text-align:right"><b>'+(s.n?s.rate.toFixed(1)+'%':'–')+'</b> · '+s.n+'次 · <span class="'+(s.verdict==="有效"?'v-good':s.verdict==="反向/无效"?'v-bad':'sub')+'">'+esc(s.verdict||"")+'</span></span></div>'+
        '<span class="sub tiny">'+(r.vote>0?'看涨':'看跌')+' · 权重 '+r.weight+(r.fund!=="*"?' · 仅 '+esc((D.funds.find(f=>f.code===r.fund)||{}).short||r.fund):'')+' · <code class="num">'+esc(r.when)+'</code></span></div>';
    });
    if((st.ideas||[]).length)h+='<div class="card"><b style="font-size:14px">野路子候选</b>'+st.ideas.map(i=>'<span style="font-size:13px">· '+esc(i.text)+' <span class="sub tiny">'+esc(i.date)+'</span></span>').join('')+'<span class="sub tiny">需要新的数据源，跟 Claude 说想试哪条。</span></div>';
    h+='<details class="card fold"><summary><span>修改记录</span><span class="sub small">'+st.changelog.length+' 次 · 被拒 '+((st.rejected||[]).length)+' 次</span></summary>'+
      [...st.changelog].reverse().map(c=>'<div style="font-size:13px;border-top:1px solid var(--line);padding-top:8px"><b>v'+c.version+'</b> <span class="sub tiny">'+esc(c.date)+(c.brierBefore!=null?' · Brier '+c.brierBefore+' → '+c.brierAfter:'')+'</span><div>'+esc(c.changes)+'</div>'+(c.reason?'<div class="sub small">'+esc(c.reason)+'</div>':'')+'</div>').join('')+'</details>';
    $("v-lab").innerHTML=h;
  }

  function renderAll(){renderPred();renderScore();renderLab();
    $("foot").textContent=(D.status.lastRun?'上次更新 '+D.status.lastRun+' · ':'')+'每晚 22:13 复盘、修正并预测下一交易日，交易日 8:07 用隔夜美股定稿后锁定。仅作实验记录，不构成投资建议。'}

  function show(v){document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));["pred","score","lab"].forEach(k=>$("v-"+k).hidden=k!==v);window.scrollTo(0,0);try{localStorage.setItem("fd-v",v)}catch(e){}}
  document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
  try{const v=localStorage.getItem("fd-v");if(v&&$("v-"+v))show(v)}catch(e){}

  async function load(){
    try{
      const q='?t='+Date.now();
      const j=n=>fetch('data/'+n+'.json'+q,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.json()});
      const [funds,rec,stats,strat,status]=await Promise.all([j('funds'),j('records'),j('stats').catch(()=>null),j('strategy'),j('status').catch(()=>({}))]);
      D={funds:[...funds].sort((a,b)=>(a.order||0)-(b.order||0)),rec,stats,strat,status};
      renderAll();
    }catch(e){$("v-pred").innerHTML='<div class="empty">数据读取失败：'+esc(e.message)+'，下拉或稍后再打开。</div>'}
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
  load();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
