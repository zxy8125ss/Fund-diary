<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>基金日记</title>
<meta name="theme-color" content="#F3F5F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="基金日记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
/* 手机优先的预测实验记录本：预测（独立判断 → 看草稿定稿 → Issue 公证）/ 成绩（是否胜过基准）/ 实验室（信号与模型版本）。A股惯例红涨绿跌 */
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#1A2233; --sub:#5A6478; --line:#E6EAF0; --soft:#EEF1F6;
  --accent:#2F55D4; --accent-soft:#E8EEFC;
  --up:#C8322B; --down:#1E7A47; --mid:#7A6A2A;
  --ok:#1F7A70; --ok-soft:#E2F3F0; --warn:#9A6A12; --warn-soft:#FBF1DC; --bad:#A33A2E; --bad-soft:#FBE6E3; --track:#DDE2EA;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-head:"Songti SC","Noto Serif SC","STSong",serif;
  --f-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --card:#1A2029; --ink:#E6EAF2; --sub:#9AA3B5; --line:#2A3240; --soft:#222A36;
  --accent:#8FAAF5; --accent-soft:#1F2A44; --up:#FF6E62; --down:#4FC07E; --mid:#D9B65A;
  --ok:#4FC1B4; --ok-soft:#173330; --warn:#E0B65A; --warn-soft:#352C17; --bad:#FF8A7A; --bad-soft:#3A1F1D; --track:#2E3746; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --card:#1A2029; --ink:#E6EAF2; --sub:#9AA3B5; --line:#2A3240; --soft:#222A36;
  --accent:#8FAAF5; --accent-soft:#1F2A44; --up:#FF6E62; --down:#4FC07E; --mid:#D9B65A;
  --ok:#4FC1B4; --ok-soft:#173330; --warn:#E0B65A; --warn-soft:#352C17; --bad:#FF8A7A; --bad-soft:#3A1F1D; --track:#2E3746; color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.up{color:var(--up)} .down{color:var(--down)} .mid{color:var(--mid)}
h1{font-family:var(--f-head);font-size:22px;margin:0;line-height:1.25;white-space:nowrap}
h2{font-size:15px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.datenav{display:flex;align-items:center;gap:2px;min-width:0}
.datenav h1{font-family:var(--f-num);font-size:19px}
.icon{border:none;background:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--sub);flex:none}
.icon:hover{background:var(--soft)} .icon:disabled{opacity:.3;cursor:default} .icon svg{width:20px;height:20px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-lock{background:var(--accent-soft);color:var(--accent)} .p-open{background:var(--warn-soft);color:var(--warn)} .p-miss{background:var(--soft);color:var(--sub)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.big{font-family:var(--f-num);font-size:36px;font-weight:600;line-height:1.05}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:13px 16px;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;min-height:52px}
.row:last-child{border-bottom:none}
.row .nm{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-family:var(--f-num);font-size:18px;font-weight:600;text-align:right;min-width:76px}
.row .a{font-family:var(--f-num);font-size:13px;text-align:right;min-width:70px}
.chev{color:var(--sub)}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;min-height:46px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-p{background:var(--accent);color:#fff} .btn-g{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hit{color:var(--accent);font-weight:700} .miss{color:var(--sub);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--sub);font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);vertical-align:top}
.tbl td.t{font-family:var(--f-body)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.me td{font-weight:600}
.scroll{overflow-x:auto}
.tag{font-size:11.5px;padding:1px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-n{background:var(--soft);color:var(--sub)} .t-ac{background:var(--accent-soft);color:var(--accent)} .t-up{background:color-mix(in srgb,var(--up) 13%,transparent);color:var(--up)} .t-down{background:color-mix(in srgb,var(--down) 13%,transparent);color:var(--down)}
ol.news{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.55} ol.news li{display:flex;flex-direction:column;gap:3px}
ol.pts,ul.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--sub)} .kv dd{margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-num);font-size:19px;font-weight:600}
.verdict{font-size:18px;font-weight:700;line-height:1.45}
.empty{color:var(--sub);text-align:center;padding:22px 12px;background:var(--card);border-radius:14px;font-size:14px;line-height:1.6}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabbar button{border:none;background:none;padding:6px 0;font-size:12.5px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .app{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.sheethead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:6px;padding:6px 0;z-index:2}
.sheethead h2{flex:1;font-size:16px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--track)}
.steps span.on{background:var(--accent)}
.vin{display:flex;align-items:center;gap:6px}
.vin input{width:96px;font-family:var(--f-num);font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:right}
.vin input:disabled{background:var(--soft)}
.pm{border:1px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
textarea,input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);font-size:14px}
select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);font-size:13.5px;min-height:40px}
textarea{min-height:44px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.reason{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:10px;padding:8px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.link{border:none;background:none;color:var(--accent);cursor:pointer;padding:6px 0;font-size:13.5px;text-align:left}
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cmp div{background:var(--soft);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
.cmp b{font-family:var(--f-num);font-size:15px}
.sticky{position:sticky;top:52px;z-index:1}
.foot{font-size:11.5px;color:var(--sub);line-height:1.6;padding:0 4px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
details>summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="main">
  <section id="v-pred"><div class="empty">读取中…</div></section>
  <section id="v-score" hidden></section>
  <section id="v-lab" hidden></section>
  <p class="foot" id="foot"></p>
</main>
<div class="sheet" id="sheet" hidden></div>
<nav class="tabbar" role="tablist" aria-label="主导航"><div>
  <button role="tab" data-v="pred" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>预测</button>
  <button role="tab" data-v="score" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10"/><path d="M12 20V4"/><path d="M18 20v-7"/></svg>成绩</button>
  <button role="tab" data-v="lab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg>实验室</button>
</div></nav>

<script>
(function(){
  const OWNER="zxy8125ss", REPO="Fund-diary", API=`https://api.github.com/repos/${OWNER}/${REPO}`;
  try{localStorage.removeItem("fd-token");localStorage.removeItem("fd-issue-key")}catch(e){}   // v2.0 的仓库写权限令牌作废；v2.1 只保存仅能建 Issue 的 fd-issue-key
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=v=>v==null||isNaN(v)?"–":(v>0?"+":"")+Number(v).toFixed(2)+"%";
  const f2=v=>v==null||isNaN(v)?"–":Number(v).toFixed(2);
  const pp=v=>v==null||isNaN(v)?"–":Number(v).toFixed(1)+"%";
  const cls=v=>v==null?"sub":v>0?"up":v<0?"down":"mid";
  const WD="日一二三四五六";
  const dlabel=d=>{const t=new Date(d+"T00:00:00Z");return String(t.getUTCMonth()+1).padStart(2,"0")+"."+String(t.getUTCDate()).padStart(2,"0")+" 周"+WD[t.getUTCDay()]};
  const md=iso=>{const t=Date.parse(iso);return isNaN(t)?"":new Date(t+8*3600e3).toISOString().slice(5,10).replace("-","/")};
  const hm=iso=>{if(!iso)return "";const t=Date.parse(iso);return isNaN(t)?String(iso).slice(11,16):new Date(t+8*3600e3).toISOString().slice(11,16)};
  const bjNow=()=>new Date(Date.now()+8*3600e3);
  const nowIso=()=>bjNow().toISOString().slice(0,19)+"+08:00";
  const todayBJ=()=>bjNow().toISOString().slice(0,10);
  const NAMES={user:"我",bench_external_raw:"原始外盘",bench_external_beta:"外盘 Beta",bench_prev:"昨日延续",bench_zero:"永远 0%",model:"规则模型",ai:"AI"};
  const LONG={bench_external_raw:"原始外盘跟随（预测＝隔夜外盘涨跌）",bench_external_beta:"外盘 Beta（预测＝β×隔夜外盘，β 在研究集拟合）",bench_prev:"昨日延续（预测＝上一个净值日涨跌）",bench_zero:"永远 0%（只比 MAE）"};
  const VERDICT={"有效依据":"t-ok","今天未触发":"t-warn","历史不成立":"t-bad","预测前已成立":"t-ok","事后信息":"t-bad","疑似事后信息":"t-bad","数据不在快照中":"t-n","核心变量":"t-ok","非核心变量":"t-warn","装饰":"t-warn","无法判断":"t-n"};
  const STATUS_TAG={"有效":"t-ok","待验证":"t-warn","实验中":"t-n","失效":"t-bad","淘汰":"t-bad"};
  const USTATUS={ok:"已锁定",late:"迟交（不计分）",unverified:"未经公证（不计分）",modified_scored_first:"文件被改动（按首次内容计分）",absent:"缺席"};
  let G=null, cur=null, cache={};

  async function j(p){try{const r=await fetch(p+(p.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
  async function apiRaw(path){try{const r=await fetch(`${API}/contents/${path}?t=${Date.now()}`,{headers:{accept:"application/vnd.github.raw+json"},cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
  function toast(t){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
  const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
  const sig=id=>G.signals.find(s=>s.id===id);
  const sigHist=s=>{if(!s||!s.stats)return "暂无历史样本";const R=s.stats.research||{};return R.days?`研究集 ${pp(R.rate)}（${R.days} 天，基准 ${pp(R.base)}，95% 区间 ${f2(R.lo)}~${f2(R.hi)}）`:"暂无历史样本"};
  const visibleTrig=(trig,code)=>((trig&&trig.funds[code])||[]).filter(t=>{const s=sig(t.signal);return !(s&&s.sourceType==="外部观点"&&t.status!=="有效")});
  const deadlineOf=T=>T+"T"+G.config.deadline+":00+08:00";
  const weights=()=>Object.fromEntries(G.funds.map(f=>[f.code,Math.max(0,((G.holdings[f.code]||f.holding||{}).amount)||0)]));
  function portfolio(vals){const w=weights();let s=0,t=0;for(const f of G.funds){const v=vals[f.code];if(v==null)continue;s+=w[f.code]*v;t+=w[f.code]}if(t)return Math.round(s/t*100)/100;const xs=G.funds.map(f=>vals[f.code]).filter(v=>v!=null);return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length*100)/100:null}

  // ---------- 某一天的数据 ----------
  async function loadDay(T){
    if(cache[T])return cache[T];
    const info=G.index.days[T]||{batches:[]};
    const d={T,info,batches:[]};
    const snaps=await Promise.all((info.batches||[]).map(b=>j(`data/snapshots/${T}/${b}.json`).then(s=>s&&{batch:b,snap:s})));
    d.batches=snaps.filter(Boolean).sort((a,b)=>Date.parse(a.snap.asOf)-Date.parse(b.snap.asOf));
    [d.user,d.lock,d.result,d.review]=await Promise.all([j(`data/predictions/${T}/user.json`),j(`data/locks/${T}/user.json`),info.result?j(`data/results/${T}.json`):null,info.review?j(`data/reviews/${T}.json`):null]);
    const pend=store.get("fd-pending-"+T);
    if(!d.lock&&pend){const L=await apiRaw(`data/locks/${T}/user.json`);if(L){d.lock=L;d.user=await apiRaw(`data/predictions/${T}/user.json`);store.del("fd-pending-"+T)}}
    const limit=d.lock?d.lock.serverLockedAt:null;
    d.seen=limit?d.batches.filter(b=>Date.parse(b.snap.asOf)<=Date.parse(limit)).at(-1)||null:d.batches.at(-1)||null;
    d.snap=d.seen&&d.seen.snap;
    [d.trig,d.digest]=d.seen?await Promise.all([j(`data/triggers/${T}/${d.seen.batch}.json`),j(`data/digests/${T}/${d.seen.batch}.json`)]):[null,null];
    return cache[T]=d;
  }
  async function sysPreds(d){   // 对照组：只用你锁定时已经生成的那个批次
    if(d.sys)return d.sys;
    const b=d.result&&d.result.meta&&d.result.meta.ai&&d.result.meta.ai.batch||(d.seen&&d.seen.batch);
    d.sys={};
    if(b){const ks=["ai","model","bench_external_raw","bench_external_beta","bench_prev","bench_zero"];const xs=await Promise.all(ks.map(k=>j(`data/predictions/${d.T}/${k}-${b}.json`)));ks.forEach((k,i)=>d.sys[k]=xs[i])}
    return d.sys;
  }
  function state(d){
    if(d.lock)return d.lock.onTime?{k:"lock",text:"已锁定 🔒 "+hm(d.lock.serverLockedAt)}:{k:"bad",text:"迟交 "+hm(d.lock.serverLockedAt)};
    if(store.get("fd-pending-"+d.T))return {k:"open",text:"已提交 · 等待公证"};
    if(d.user)return {k:"bad",text:"未经公证"};
    if(Date.now()>Date.parse(deadlineOf(d.T)))return {k:"miss",text:"已截止 · 缺席"};
    return {k:"open",text:"待填写 · "+G.config.deadline+" 截止"};
  }

  // ---------- 预测 ----------
  function pickDay(){
    const days=Object.keys(G.index.days).sort(), t=todayBJ();
    return days.find(x=>x>=t&&!G.index.days[x].result)||days.filter(x=>!G.index.days[x].result).at(-1)||days.at(-1)||null;
  }
  let pollTimer=null;
  async function renderPred(){
    const days=Object.keys(G.index.days).sort();
    if(!cur)cur=pickDay();
    if(!cur){$("v-pred").innerHTML='<div class="empty">还没有预测日。下一个交易日前一晚 22:13，系统会准备好当天的数据。</div>'+holdingsCard();return}
    const d=await loadDay(cur), st=state(d), i=days.indexOf(cur), res=d.result;
    let h='<div class="top"><div class="datenav"><button class="icon" data-nav="-1" aria-label="前一天"'+(i<=0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><h1>'+esc(dlabel(cur))+'</h1><button class="icon" data-nav="1" aria-label="后一天"'+(i>=days.length-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button></div><span class="pill p-'+st.k+'">'+esc(st.text)+'</span></div>';
    const u=d.lock?d.user:null;
    const actAll=res?portfolio(res.actual):null;
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>科技仓</h2>'+(res?'<span class="sub small">实际 <b class="num '+cls(actAll)+'">'+fmt(actAll)+'</b></span>':'')+'</div>';

    if(revealed){

        (S.ai&&S.ai.funds[code]&&(S.ai.funds[code].reasons||[]).length?'<details><summary class="small sub">AI 草稿的理由</summary><ol class="pts" style="margin-top:6px;font-size:13px">'+S.ai.funds[code].reasons.map(r=>'<li>'+esc(r.text)+'</li>').join('')+'</ol></details>':'')+'</div>';

        list("下次怎么改",rv.nextTime)+

    if(d.lock){

      h+='<div class="card"><h2>锁定凭证</h2><dl class="kv small"><dt>服务器时间</dt><dd class="num">'+esc(String(d.lock.serverLockedAt).replace("T"," ").slice(0,19))+'</dd><dt>截止时间</dt><dd class="num">'+esc(String(d.lock.deadline).replace("T"," ").slice(0,16))+'</dd><dt>依据快照</dt><dd class="num">'+esc(d.lock.snapshotId||"–")+'</dd><dt>预测哈希</dt><dd class="num" style="word-break:break-all">'+esc(d.lock.predictionHash)+'</dd><dt>Issue</dt><dd><a href="https://github.com/'+OWNER+'/'+REPO+'/issues/'+d.lock.issueNumber+'" target="_blank" rel="noopener">#'+d.lock.issueNumber+'</a></dd></dl></div>';
    }
    showSheet(h);
    if(d.lock)amendments(d.T,code).then(xs=>{const el=$("am-list");if(el)el.innerHTML=xs.length?'<ul class="pts">'+xs.map(a=>'<li style="color:var(--ink)">'+esc(a.text)+' <span class="sub tiny">'+esc(String(a.createdAt).replace("T"," ").slice(5,16))+'</span></li>').join('')+'</ul>':'暂无'});
  }
  const list=(t,xs)=>xs&&xs.length?'<div class="small"><b>'+t+'</b><ul class="pts" style="font-size:13.5px">'+xs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'';
  function dataName(d,id){const it=d.snap&&d.snap.items.find(i=>i.id===id);return it?(it.kind==="消息"?"快讯 "+hm(it.dataTime):it.name):id}
  async function amendments(T,code){
    try{const r=await fetch(`${API}/contents/data/amendments/${T}`);if(!r.ok)return [];const fs=await r.json();
      const xs=(await Promise.all(fs.slice(-20).map(x=>j(`data/amendments/${T}/${x.name}`)))).filter(Boolean);

  function sheetHead(t){return '<div class="app"><div class="sheethead"><button class="icon" id="sheet-x" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><h2>'+esc(t)+'</h2></div>'}
  function showSheet(h){const s=$("sheet");s.innerHTML=h+'</div>';s.hidden=false;s.scrollTop=0;$("sheet-x").addEventListener("click",closeSheet)}
  function closeSheet(){$("sheet").hidden=true;$("sheet").innerHTML="";if(cur)renderPred()}

  // ---------- 填写：第 1 步独立判断 → 第 2 步看草稿定稿 → 第 3 步检查并提交 ----------
  let draft=null;
  const blankFund=()=>({value:"",reasons:[{text:"",signals:[],dataRefs:[]}],conclusion:""});
  async function openForm(d,step){
    draft=store.get("fd-draft-"+d.T)||{date:d.T,step:1,initial:{},initialFrozenAt:null,aiSeen:null,funds:Object.fromEntries(G.funds.map(f=>[f.code,blankFund()]))};
    if(step)draft.step=step;
    renderStep(d);
  }
  const save=d=>store.set("fd-draft-"+d.T,draft);
  function parseV(s){const v=parseFloat(String(s).replace(/[%＋\s]/g,"").replace(/[−－—]/g,"-"));return Number.isFinite(v)?Math.round(Math.max(-10,Math.min(10,v))*100)/100:null}
  function stepsBar(n){return '<div class="steps" aria-label="第 '+n+' 步，共 3 步">'+[1,2,3].map(i=>'<span class="'+(i<=n?"on":"")+'"></span>').join('')+'</div>'}
  function valueInput(id,val,dis,label){return '<div class="vin"><button type="button" class="pm" data-pm="'+id+'" aria-label="切换正负"'+(dis?' disabled':'')+'>±</button><input id="'+id+'" inputmode="decimal" autocomplete="off" aria-label="'+esc(label)+'" value="'+esc(val)+'"'+(dis?' disabled':'')+'><span class="sub">%</span></div>'}
  function bindPM(S,onChange){S.querySelectorAll("[data-pm]").forEach(b=>b.addEventListener("click",()=>{const el=S.querySelector("#"+CSS.escape(b.dataset.pm));const v=el.value.trim();el.value=v.startsWith("-")?v.slice(1):(v?"-"+v.replace(/^\+/,""):"-");el.dispatchEvent(new Event("input"));el.focus()}))}
  function renderStep(d){
    if(draft.step===1)return step1(d);
    if(draft.step===2)return step2(d);
    return step3(d);
  }
  function marketCard(d){
    const items=d.snap.items.filter(it=>!it.hidden);
    const mk=items.filter(it=>it.kind==="行情"&&!String(it.key).includes(".")), nw=items.filter(it=>it.kind==="消息");
    return '<div class="card"><h2>市场数据</h2><span class="sub tiny">'+esc(d.seen.batch==="morning"?"早间":"晚间")+'快照 '+esc(hm(d.snap.asOf))+'，只含当时已经可以获得的数据</span><table class="tbl"><tbody>'+mk.map(it=>'<tr><td class="t">'+esc(it.name)+'</td><td class="'+cls(it.value)+'">'+fmt(it.value)+'</td></tr>').join('')+'</tbody></table>'+
+'</div>';

  function step1(d){
    const frozen=!!draft.initialFrozenAt;
    let h=sheetHead("第 1 步 · 独立判断")+stepsBar(1);
    h+='<div class="note">这一步看不到 AI 草稿和规则模型。只根据数据和规律，先写下你自己的判断。'+(frozen?'你已经看过 AI 草稿，初判已经固定，不能再改。':'')+'</div>';

      const ff=d.snap.features.f[f.code]||{}, trig=visibleTrig(d.trig,f.code);
      h+='<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>'+esc(f.short)+'</h3>'+valueInput("i-"+f.code,draft.initial[f.code]??"",frozen,f.short+" 初判涨跌幅")+'</div>'+
        '<div class="sub small num">上一日 '+fmt(ff.prev)+' · 近5日 '+fmt(ff.mom5)+' · '+esc(f.anchor.name)+' '+fmt(ff.anc)+' · 日波动 '+(ff.vol20!=null?ff.vol20.toFixed(2)+'%':'–')+'</div>'+
        (trig.length?'<div class="chips">'+trig.map(t=>{const s=sig(t.signal);return '<span class="tag '+(STATUS_TAG[t.status]||"t-n")+'" title="'+esc(sigHist(s))+'">'+esc(t.signal+" "+(s?s.name:"")+" · "+t.status)+'</span>'}).join('')+'</div>':'<span class="sub tiny">没有规律被触发</span>')+'</div>';
    }
    h+='</div><button class="btn btn-p" id="next1">下一步：看 AI 草稿</button><span class="sub tiny" style="text-align:center">进入下一步后，初判会固定下来，用来统计看了 AI 之后你是更准还是更差。</span>';
    showSheet(h);
    const S=$("sheet");
    S.querySelector(".sheethead h2").parentElement.querySelector("#sheet-x").onclick=()=>{save(d);closeSheet()};
    G.funds.forEach(f=>{const el=S.querySelector("#i-"+f.code);el.addEventListener("input",()=>{draft.initial[f.code]=el.value;save(d)})});
    bindPM(S);

      const vals={};for(const f of G.funds){const v=parseV(draft.initial[f.code]);if(v==null){toast(f.short+" 还没填初判");return}vals[f.code]=v}
      if(!frozen){draft.initial=vals;draft.initialFrozenAt=nowIso();for(const f of G.funds)if(draft.funds[f.code].value==="")draft.funds[f.code].value=String(vals[f.code])}
      draft.step=2;save(d);renderStep(d);
    });

  async function step2(d){
    const S0=await sysPreds(d), ai=S0.ai, model=S0.model;
    if(!draft.aiSeen)draft.aiSeen={batch:d.seen.batch,snapshotId:d.seen.snap.snapshotId,aiVersion:ai&&ai.aiVersion||null,modelName:ai&&ai.modelName||null,seenAt:nowIso()};
    save(d);

  function checkReason(d,code,r,lockIso){
    const sv=(r.signals||[]).map(id=>{const t=((d.trig&&d.trig.funds[code])||[]).find(x=>x.signal===id);return {id,verdict:!t?"今天未触发":t.status!=="有效"?"历史不成立":"有效依据"}});
    const dv=(r.dataRefs||[]).map(id=>{const it=d.snap&&d.snap.items.find(i=>i.id===id);return {id,verdict:!it?"数据不在快照中":Date.parse(it.cutoff)<=Date.parse(lockIso)?"预测前已成立":"事后信息"}});
    return {signals:sv,data:dv};
  }
  function buildPayload(d){
    const funds={};for(const f of G.funds){const x=draft.funds[f.code];funds[f.code]={value:parseV(x.value),reasons:x.reasons.filter(r=>r.text.trim()).map(r=>({text:r.text.trim(),signals:r.signals,dataRefs:r.dataRefs})),conclusion:x.conclusion.trim()}}
    return {v:1,date:d.T,clientSubmittedAt:nowIso(),snapshotId:d.seen.snap.snapshotId,initial:draft.initial,initialFrozenAt:draft.initialFrozenAt,aiSeen:draft.aiSeen,funds};
  }
  function b64url(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  async function issueBody(payload){
    const json=JSON.stringify(payload);
    let block;
    if("CompressionStream" in window){try{const cs=new CompressionStream("deflate-raw");const w=cs.writable.getWriter();w.write(new TextEncoder().encode(json));w.close();const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());block="```fd1\n"+b64url(buf).replace(/(.{76})/g,"$1\n")+"\n```"}catch(e){}}
    if(!block)block="```json\n"+json+"\n```";
    return "基金日记 "+payload.date+" 预测（由 app 生成，请直接提交，不要改动下面的内容）\n\n"+block+"\n";
  }
  function step3(d){
    const late=Date.now()>Date.parse(deadlineOf(d.T)), lockIso=nowIso(), pl=buildPayload(d);

    let body='';

      body+='<div class="small" style="border-top:1px solid var(--line);padding-top:8px"><b>'+esc(f.short)+'</b> <span class="num '+cls(x.value)+'">'+fmt(x.value)+'</span> <span class="sub tiny">初判 '+fmt(pl.initial[f.code])+'</span>'+
        (x.reasons.length?'<ol class="pts" style="font-size:13px">'+x.reasons.map(r=>{const c=checkReason(d,f.code,r,lockIso);
          c.signals.forEach(s=>ev[s.verdict==="有效依据"?"validSignals":s.verdict==="今天未触发"?"notTriggered":"historicallyInvalid"]++);c.data.forEach(s=>{if(s.verdict==="预测前已成立")ev.dataRefs++;else if(s.verdict==="事后信息")ev.afterLock++});if(!c.signals.length&&!c.data.length)ev.subjectiveOnly++;
          return '<li>'+esc(r.text)+'<div class="chips">'+c.signals.map(s=>'<span class="tag '+VERDICT[s.verdict]+'">'+esc(s.id+" "+s.verdict)+'</span>').join('')+c.data.map(s=>'<span class="tag '+VERDICT[s.verdict]+'">'+esc(dataName(d,s.id)+" · "+s.verdict)+'</span>').join('')+(!c.signals.length&&!c.data.length?'<span class="tag t-n">主观判断</span>':'')+'</div></li>'}).join('')+'</ol>':'<div class="sub">没有写理由（记为纯主观）</div>')+
        (x.conclusion?'<div>结论：'+esc(x.conclusion)+'</div>':'')+'</div>'}
    const vals=Object.fromEntries(G.funds.map(f=>[f.code,pl.funds[f.code].value]));
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>科技仓</h2><b class="num '+cls(portfolio(vals))+'" style="font-size:20px">'+fmt(portfolio(vals))+'</b></div>'+
      '<h3>依据完整性</h3><div class="chips"><span class="tag t-ok">数据依据 '+ev.dataRefs+'</span><span class="tag t-ok">有效信号 '+ev.validSignals+'</span><span class="tag t-warn">今天未触发 '+ev.notTriggered+'</span><span class="tag t-bad">历史无效 '+ev.historicallyInvalid+'</span><span class="tag t-bad">事后信息 '+ev.afterLock+'</span><span class="tag t-n">纯主观 '+ev.subjectiveOnly+'</span></div>'+
      '<span class="sub tiny" style="line-height:1.6">有问题的依据也可以提交，但会被记录，以后统计这类预测是不是更不准。最终以服务器锁定时的检查为准。</span>'+body+'</div>';
    h+='<div class="card"><h2>怎么提交</h2><span class="small" style="line-height:1.7">点下面「提交」，会打开一个已经填好内容的 GitHub 页面，只要点绿色的 <b>Submit new issue</b> 就完成了。回到这里约 1 分钟后显示「已锁定 🔒」。</span><span class="sub tiny" style="line-height:1.6">如果打开的是 GitHub App 且内容是空的：内容已自动复制，在正文框长按「粘贴」再点 Submit。</span></div>';
    h+='<div style="display:flex;gap:10px"><button class="btn btn-g" id="back3" style="flex:1">上一步</button><button class="btn btn-p" id="submit" style="flex:2">提交</button></div>';

    $("sheet-x").onclick=()=>{save(d);closeSheet()};

    $("submit").addEventListener("click",async()=>{
      const payload=buildPayload(d), body=await issueBody(payload), title="预测 "+d.T;
      try{await navigator.clipboard.writeText(body)}catch(e){}
      let url=`https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
      if(url.length>7800)url=`https://github.com/${OWNER}/${REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent("（内容较长，请把剪贴板里的内容粘贴到这里）")}`;

  // ---------- 成绩 ----------

    const S=G.stats;
    if(!S||!S.predictors){$("v-score").innerHTML='<div class="empty">暂无统计</div>';return}
    const P=S.predictors, U=P.user, C=S.conclusion||{}, cmp=(S.compare&&S.compare.user)||{};
    const bD=C.bestDirectionBenchmark, bM=C.bestMaeBenchmark, cD=bD&&cmp[bD], cM=bM&&cmp[bM];
    let h='<div class="top"><h1>成绩</h1><span class="sub small">样本单位：交易日 × 基金</span></div>';

    h+='<div class="card"><span class="sub small">我到底有没有预测能力？</span><span class="verdict">'+esc(vt)+'</span><span class="small" style="line-height:1.6">'+esc(vs)+'</span>'+
      '<div class="kpis"><div class="kpi"><span class="sub tiny">正式预测</span><b>'+(U.lockedDays||0)+' 天</b></div><div class="kpi"><span class="sub tiny">有效观测</span><b>'+U.obs+'</b><span class="sub tiny">'+U.days+' 个交易日</span></div><div class="kpi"><span class="sub tiny">方向命中</span><b>'+pp(U.rate)+'</b></div></div>'+
      '<div class="kpis"><div class="kpi"><span class="sub tiny">MAE</span><b>'+(U.mae!=null?f2(U.mae)+'%':'–')+'</b></div><div class="kpi"><span class="sub tiny">方向提升</span><b>'+(cD&&cD.direction.liftPP!=null?(cD.direction.liftPP>0?"+":"")+cD.direction.liftPP.toFixed(1)+'pp':'–')+'</b><span class="sub tiny">vs '+esc(bD?NAMES[bD]:"–")+'</span></div><div class="kpi"><span class="sub tiny">MAE 改善</span><b>'+(cM&&cM.mae.improvePct!=null?(cM.mae.improvePct>0?"+":"")+cM.mae.improvePct.toFixed(1)+'%':'–')+'</b><span class="sub tiny">vs '+esc(bM?NAMES[bM]:"–")+'</span></div></div></div>';
    if(U.obs&&(cD||cM)){
      const row=(lab,x,k)=>!x?'':'<tr><td class="t">'+lab+'</td><td>'+(x[k].ci95?f2(x[k].ci95[0])+' ~ '+f2(x[k].ci95[1]):'样本不足')+'</td><td>'+(x[k].alwaysValidP??'–')+'</td></tr>';
      const e=(C.endpoints||[]);
      h+='<div class="card"><h2>主要检验</h2><dl class="kv small"><dt>最佳方向基准</dt><dd>'+esc(bD?NAMES[bD]:"–")+'（'+pp(bD&&P[bD].rate)+'）</dd><dt>最佳 MAE 基准</dt><dd>'+esc(bM?NAMES[bM]:"–")+'（'+(bM?f2(P[bM].mae)+'%':'–')+'）</dd>'+(cD?'<dt>方向对比</dt><dd>我对它错 '+cD.direction.wins+' 次，我错它对 '+cD.direction.losses+' 次</dd>':'')+'</dl>'+
        '<div class="scroll"><table class="tbl"><thead><tr><th>检验</th><th>按日聚类 95% 区间</th><th>随时有效 p</th></tr></thead><tbody>'+row("方向（百分点）",cD,"direction")+row("MAE（百分点）",cM,"mae")+'</tbody></table></div>'+

      ["user","bench_external_raw","bench_external_beta","bench_prev","bench_zero","model","ai"].map(k=>{const x=P[k]||{};return '<tr class="'+(k==="user"?"me":"")+'"><td class="t">'+NAMES[k]+(k==="model"||k==="ai"?' <span class="sub tiny">对照</span>':'')+'</td><td>'+(k==="bench_zero"?'<span class="sub tiny">不参与</span>':pp(x.rate))+'</td><td>'+(x.mae!=null?f2(x.mae)+'%':'–')+'</td><td>'+(x.obs||0)+'</td></tr>'}).join('')+
      '</tbody></table></div><span class="sub tiny" style="line-height:1.6">方向分三态：涨 &gt; +'+G.config.flatBand+'%，跌 &lt; −'+G.config.flatBand+'%，其余为平；预测和实际用同一规则。永远 0% 天然预测「平」，只比 MAE。和规则模型、AI 的对比属于探索性，不能据此说「显著」。</span>'+

  async function renderLedger(){
    const days=Object.keys(G.index.days).filter(d=>G.index.days[d].result).sort().reverse();
    if(!days.length)return;
    const rs=(await Promise.all(days.slice(0,10).map(T=>j(`data/results/${T}.json`)))).filter(Boolean);
    let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>流水账</h2><button class="link" id="csv">下载 CSV</button></div><div class="scroll"><table class="tbl"><thead><tr><th>日期</th><th style="text-align:left">基金</th><th>我</th><th>实际</th><th></th><th>误差</th></tr></thead><tbody>';
    for(const r of rs)for(const f of G.funds){const s=r.scores.user&&r.scores.user[f.code];const a=r.actual[f.code];h+='<tr><td>'+r.date.slice(5)+'</td><td class="t">'+esc(f.short)+'</td><td class="'+cls(s&&s.pred)+'">'+(s?fmt(s.pred):'<span class="sub tiny">'+esc(USTATUS[(r.meta.user||{}).status]||"")+'</span>')+'</td><td class="'+cls(a)+'">'+fmt(a)+'</td><td>'+(s?(s.hit?'<span class="hit">✓</span>':'<span class="miss">✗</span>'):'')+'</td><td>'+(s?f2(s.absErr):'')+'</td></tr>'}
    $("ledger").innerHTML=h+'</tbody></table></div><span class="sub tiny">锁定时间以 GitHub 服务器收到 Issue 的时间为准；每份预测都有哈希凭证。</span></div>';
    $("csv").addEventListener("click",async()=>{
      const all=(await Promise.all(days.map(T=>j(`data/results/${T}.json`)))).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
      const ks=["user","bench_external_raw","bench_external_beta","bench_prev","bench_zero","model","ai"];
      const lines=[["日期","基金代码","基金","实际%",...ks.map(k=>NAMES[k]+"%"),"我的状态","锁定时间"].join(",")];
      for(const r of all)for(const f of G.funds)lines.push([r.date,f.code,f.short,r.actual[f.code]??"",...ks.map(k=>(r.scores[k]&&r.scores[k][f.code]?r.scores[k][f.code].pred:"")),(r.meta.user||{}).status||"",(r.meta.user||{}).serverLockedAt||""].join(","));
      const url=URL.createObjectURL(new Blob(["﻿"+lines.join("\n")],{type:"text/csv"}));const a=document.createElement("a");a.href=url;a.download="基金日记.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
    });
  }

  // ---------- 实验室 ----------
  function renderLab(){
    const S=G.stats||{}, st=G.status||{}, sp=st.split||{};
    let h='<div class="top"><h1>实验室</h1><span class="sub small">规则模型 '+esc(G.model?G.model.version:"–")+'</span></div>';
    const board=(t,xs,good,empty)=>'<div class="card"><h2>'+t+'</h2>'+(xs&&xs.length?'<ol class="pts">'+xs.map(x=>'<li>'+esc(x.name)+' <span class="num" style="font-weight:600;color:var(--'+(good?'ok':'bad')+')">'+pp(x.rate)+'</span><div class="sub tiny">95% 区间 '+f2(x.lo)+'~'+f2(x.hi)+' · 基准 '+pp(x.base)+' · '+x.days+' 个交易日 · '+esc(x.status)+'</div></li>').join('')+'</ol>':'<span class="sub small">'+empty+'</span>')+'</div>';
    h+=board("最可靠的规律",S.reliable,true,"样本还不够（每条至少 "+G.config.signals.minDays+" 个交易日）。")+board("最会骗人的规律",S.deceptive,false,"样本还不够。");
    h+='<div class="card"><h2>信号库</h2><span class="sub tiny" style="line-height:1.6">研究集 '+esc((sp.research||[]).join(" ~ "))+'；留出集 '+esc((sp.holdout||[]).join(" ~ "))+'（起点固定，不滚动）。样本按交易日计：同一天 5 只基金高度相关，只算 1 个独立样本。</span>';
    const order={"有效":0,"待验证":1,"实验中":2,"失效":3,"淘汰":4};
    for(const s of [...G.signals].filter(s=>s.sourceType!=="外部观点"||s.status==="有效").sort((a,b)=>(order[a.status]-order[b.status])||a.id.localeCompare(b.id))){
      const R=(s.stats||{}).research||{},O=(s.stats||{}).holdout||{},F=(s.stats||{}).forward||{};
      const r=(lab,x)=>'<tr><td class="t">'+lab+'</td><td>'+(x.days||0)+'</td><td>'+pp(x.rate)+(x.lo!=null?'<div class="sub tiny">'+f2(x.lo)+'~'+f2(x.hi)+'</div>':'')+'</td><td>'+pp(x.base)+'</td><td>'+(x.signal_mean_forecast_mae!=null?f2(x.signal_mean_forecast_mae):'–')+'</td></tr>';
      h+='<details style="border-top:1px solid var(--line);padding-top:8px"><summary style="display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:36px"><span style="min-width:0"><b class="num">'+esc(s.id)+'</b> '+esc(s.name)+'</span><span class="tag '+(STATUS_TAG[s.status]||"t-n")+'">'+esc(s.status)+(s.pending?' → '+esc(s.pending.to)+' '+s.pending.count+'/'+G.config.signals.hysteresisDays:'')+'</span></summary>'+
        '<div class="scroll"><table class="tbl" style="margin-top:6px"><thead><tr><th></th><th>交易日</th><th>方向命中</th><th>基准</th><th>幅度MAE</th></tr></thead><tbody>'+r("研究集",R)+r("留出集",O)+r("提出后",F)+'</tbody></table></div>'+
        '<div class="sub tiny" style="line-height:1.6">条件 <code class="num">'+esc(s.when)+'</code> → '+(s.vote>0?'看涨':'看跌')+(s.scope!=="*"?' · 仅 '+esc((G.funds.find(f=>f.code===s.scope)||{}).short||s.scope):'')+' · 多重检验校正 '+(s.bhPass?'通过':'未通过')+' · 版本 v'+(s.version||1)+'</div>'+
        '<div class="sub tiny">「幅度MAE」＝用触发时的历史平均涨跌当预测值的误差，衡量幅度能力，和方向命中是两回事。</div></details>';
    }
    h+='<span class="sub tiny" style="line-height:1.6">状态：实验中（不足 '+G.config.signals.minDays+' 个交易日）→ 待验证 → 有效（研究集区间下限高于基准、通过多重检验校正、留出集确认）→ 失效 → 淘汰（失效满 '+G.config.signals.retireAfter+' 个交易日）。转为有效或失效需要连续 '+G.config.signals.hysteresisDays+' 天满足条件。复盘提出的新规律只用提出之后的数据验证。</span></div>';
    const cl=[...(G.modelLog||[])].reverse(), live=S.models||{};
    h+='<div class="card"><h2>规则模型版本</h2>'+(cl.length?cl.map(c=>{const L=live[c.version];return '<div style="border-top:1px solid var(--line);padding-top:8px;font-size:13.5px;display:flex;flex-direction:column;gap:4px"><div><b>'+esc(c.version)+'</b> <span class="tag '+(c.status==="launched"?'t-ok':'t-bad')+'">'+(c.status==="launched"?'已上线':'未上线')+'</span> <span class="sub tiny">'+esc(String(c.createdAt).slice(0,10))+'</span></div><div>'+esc(c.change||"")+'</div>'+(c.reason?'<div class="sub small">'+esc(c.reason)+'</div>':'')+
      '<div class="scroll"><table class="tbl"><thead><tr><th></th><th>命中</th><th>MAE</th></tr></thead><tbody>'+
      '<tr><td class="t">研究集</td><td>'+(c.research.old?pp(c.research.old.rate)+'→':'')+pp(c.research.new.rate)+'</td><td>'+(c.research.old?f2(c.research.old.mae)+'→':'')+f2(c.research.new.mae)+'</td></tr>'+
      '<tr><td class="t">留出集</td><td>'+(c.holdout.old?pp(c.holdout.old.rate)+'→':'')+pp(c.holdout.new.rate)+'</td><td>'+(c.holdout.old?f2(c.holdout.old.mae)+'→':'')+f2(c.holdout.new.mae)+'</td></tr>'+
      (c.vsBenchmark?'<tr><td class="t">最佳基准（留出集）</td><td>'+pp(c.vsBenchmark.holdout.rate)+'</td><td>'+f2(c.vsBenchmark.holdout.mae)+'</td></tr>':'')+
      '<tr><td class="t"><b>上线后实盘</b></td><td>'+(L?pp(L.rate):'–')+'</td><td>'+(L?f2(L.mae):'–')+'</td></tr></tbody></table></div><span class="sub tiny">'+(c.signals&&c.signals.length?'使用信号：'+esc(c.signals.join("、")):'没有被证明有效的信号，模型每天预测 0%。')+(L?' · 实盘 '+L.obs+' 个观测':'')+'</span></div>'}).join(''):'<span class="sub small">暂无</span>')+
      '<span class="sub tiny">回测只是初筛；真正的检验是每个版本上线之后的实盘成绩。</span></div>';
    $("v-lab").innerHTML=h;
  }

  // ---------- 框架 ----------
  function show(v){document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));["pred","score","lab"].forEach(k=>$("v-"+k).hidden=k!==v);window.scrollTo(0,0);try{localStorage.setItem("fd-v",v)}catch(e){}}
  document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
  try{const v=localStorage.getItem("fd-v");if(v&&$("v-"+v))show(v)}catch(e){}
  async function load(){
    const [config,funds,holdings,index,signals,stats,modelLog,status,model]=await Promise.all(["config","funds","state/holdings","index","signals/public","stats","models/changelog","status","models/current"].map(n=>j(`data/${n}.json`)));
    if(!config||!funds||!index){$("v-pred").innerHTML='<div class="empty">数据读取失败，请稍后再打开。</div>';return}
    G={config,funds:[...funds].sort((a,b)=>(a.order||0)-(b.order||0)),holdings:holdings||{},index,signals:signals||[],stats,modelLog:modelLog||[],status:status||{},model};
    cache={};
    await renderPred();renderScore();renderLab();
    $("foot").textContent=(status&&status.lastRun?'数据更新于 '+String(status.lastRun).replace("T"," ").slice(0,16)+' · ':'')+'每晚 22:13 结算并准备下一交易日数据，交易日 08:07 补充隔夜美股，'+config.deadline+' 截止（集合竞价之前）。仅作实验记录，不构成投资建议。';
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$("sheet").hidden)load()});
  load();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
