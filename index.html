<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>基金日记</title>
<meta name="theme-color" content="#F3F5F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="基金日记">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
/* 手机优先的实验记录本：预测（填写、锁定、详情）/ 成绩（是否胜过基准）/ 实验室（信号与版本）。A股惯例红涨绿跌 */
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#1A2233; --sub:#5A6478; --line:#E6EAF0; --soft:#EEF1F6;
  --accent:#2F55D4; --accent-soft:#E8EEFC;
  --up:#C8322B; --down:#1E7A47; --mid:#7A6A2A;
  --ok:#1F7A70; --ok-soft:#E2F3F0; --warn:#9A6A12; --warn-soft:#FBF1DC; --bad:#A33A2E; --bad-soft:#FBE6E3; --track:#DDE2EA;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-head:"Songti SC","Noto Serif SC","STSong",serif;
  --f-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --card:#1A2029; --ink:#E6EAF2; --sub:#9AA3B5; --line:#2A3240; --soft:#222A36;
  --accent:#8FAAF5; --accent-soft:#1F2A44; --up:#FF6E62; --down:#4FC07E; --mid:#D9B65A;
  --ok:#4FC1B4; --ok-soft:#173330; --warn:#E0B65A; --warn-soft:#352C17; --bad:#FF8A7A; --bad-soft:#3A1F1D; --track:#2E3746; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --card:#1A2029; --ink:#E6EAF2; --sub:#9AA3B5; --line:#2A3240; --soft:#222A36;
  --accent:#8FAAF5; --accent-soft:#1F2A44; --up:#FF6E62; --down:#4FC07E; --mid:#D9B65A;
  --ok:#4FC1B4; --ok-soft:#173330; --warn:#E0B65A; --warn-soft:#352C17; --bad:#FF8A7A; --bad-soft:#3A1F1D; --track:#2E3746; color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sub{color:var(--sub)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.up{color:var(--up)} .down{color:var(--down)} .mid{color:var(--mid)}
h1{font-family:var(--f-head);font-size:22px;margin:0;line-height:1.25;white-space:nowrap}
.datenav h1{font-family:var(--f-num);font-size:19px}
h2{font-size:15px;margin:0;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.datenav{display:flex;align-items:center;gap:4px}
.icon{border:none;background:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--sub)}
.icon:hover{background:var(--soft)} .icon svg{width:20px;height:20px}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-lock{background:var(--accent-soft);color:var(--accent)} .p-open{background:var(--warn-soft);color:var(--warn)} .p-miss{background:var(--soft);color:var(--sub)}
.card{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.big{font-family:var(--f-num);font-size:36px;font-weight:600;line-height:1.05}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:13px 16px;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;min-height:52px}
.row:last-child{border-bottom:none}
.row .nm{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-family:var(--f-num);font-size:18px;font-weight:600;text-align:right;min-width:72px}
.row .a{font-family:var(--f-num);font-size:13px;text-align:right;min-width:64px}
.chev{color:var(--sub)}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn-p{background:var(--accent);color:#fff} .btn-g{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hit{color:var(--accent);font-weight:700} .miss{color:var(--sub);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--sub);font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);vertical-align:top}
.tbl td.t{font-family:var(--f-body)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.me td{font-weight:600}
.scroll{overflow-x:auto}
.tag{font-size:11.5px;padding:1px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-n{background:var(--soft);color:var(--sub)}
ol.pts,ul.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--sub)} .kv dd{margin:0}
.verdict{font-size:18px;font-weight:700;line-height:1.4}
.empty{color:var(--sub);text-align:center;padding:22px 12px;background:var(--card);border-radius:14px;font-size:14px;line-height:1.6}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabbar button{border:none;background:none;padding:6px 0;font-size:12.5px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .app{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.sheethead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:6px;padding:8px 0;z-index:2}
.sheethead h2{flex:1;font-size:16px}
.fund-in{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.fund-in:first-child{border-top:none;padding-top:0}
.vin{display:flex;align-items:center;gap:8px}
.vin input{width:110px;font-family:var(--f-num);font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:right}
textarea,input[type=text],input[type=password]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);font-size:14px}
textarea{min-height:40px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;min-height:32px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.reason{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:10px;padding:8px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.link{border:none;background:none;color:var(--accent);cursor:pointer;padding:4px 0;font-size:13px}
.foot{font-size:11.5px;color:var(--sub);line-height:1.6;padding:0 4px}
.bar{position:relative;height:10px;background:var(--track);border-radius:5px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.bar b{position:absolute;top:-3px;bottom:-3px;border-left:1.5px dashed var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="main">
  <section id="v-pred"><div class="empty">读取中…</div></section>
  <section id="v-score" hidden></section>
  <section id="v-lab" hidden></section>
  <p class="foot" id="foot"></p>
</main>
<div class="sheet" id="sheet" hidden></div>
<nav class="tabbar" role="tablist" aria-label="主导航"><div>
  <button role="tab" data-v="pred" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>预测</button>
  <button role="tab" data-v="score" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10"/><path d="M12 20V4"/><path d="M18 20v-7"/></svg>成绩</button>
  <button role="tab" data-v="lab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg>实验室</button>
</div></nav>

<script>
(function(){
  const REPO_OWNER="zxy8125ss", REPO_NAME="Fund-diary";
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt=v=>v==null||isNaN(v)?"–":(v>0?"+":"")+Number(v).toFixed(2)+"%";
  const cls=v=>v==null?"sub":v>0?"up":v<0?"down":"mid";
  const WD="日一二三四五六";
  const dlabel=d=>{const t=new Date(d+"T00:00:00Z");return String(t.getUTCMonth()+1).padStart(2,"0")+"."+String(t.getUTCDate()).padStart(2,"0")+" 周"+WD[t.getUTCDay()]};
  const hm=iso=>iso?String(iso).slice(11,16):"";
  const NAMES={user:"我的预测",ai:"AI 草稿",model:"规则模型",bench_us:"跟随外盘",bench_prev:"昨日延续",bench_zero:"永远 0%"};
  const BATCH={morning:"早间",evening:"晚间",early:"提前"};
  const VERDICT={"有效依据":"t-ok","今天未触发":"t-warn","历史不成立":"t-bad","预测前已成立":"t-ok","事后信息":"t-bad","疑似事后信息":"t-bad","数据不在快照中":"t-n","核心变量":"t-ok","对结论影响小":"t-warn","装饰":"t-warn","无法判断":"t-n"};
  const STATUS_TAG={"有效":"t-ok","待验证":"t-warn","实验中":"t-n","失效":"t-bad","淘汰":"t-bad"};
  const bjNow=()=>new Date(Date.now()+8*3600e3);
  const todayBJ=()=>bjNow().toISOString().slice(0,10);
  let G=null, cur=null, dayCache={};
  let tok=null; try{tok=localStorage.getItem("fd-token")}catch(e){}

  async function j(p){try{const r=await fetch(p+(p.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)return null;return await r.json()}catch(e){return null}}
  function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}

  // ---------- 数据 ----------
  async function loadDay(T){
    if(dayCache[T])return dayCache[T];
    const info=G.index.days[T]||{batches:[]};
    const b=["morning","evening","early"].find(x=>info.batches.includes(x));
    const d={T,batch:b,info};
    const tasks={snap:b&&j(`data/snapshots/${T}/${b}.json`),trig:b&&j(`data/triggers/${T}/${b}.json`),ai:b&&j(`data/predictions/${T}/ai-${b}.json`),model:b&&j(`data/predictions/${T}/model-${b}.json`),bench_us:b&&j(`data/predictions/${T}/bench_us-${b}.json`),bench_prev:b&&j(`data/predictions/${T}/bench_prev-${b}.json`),user:j(`data/predictions/${T}/user.json`),result:info.result?j(`data/results/${T}.json`):null,review:info.review?j(`data/reviews/${T}.json`):null};
    for(const[k,p]of Object.entries(tasks))d[k]=p?await p:null;
    if(!d.user&&localUser[T])d.user=localUser[T];
    return dayCache[T]=d;
  }
  const localUser={};
  function sig(id){return G.signals.find(s=>s.id===id)}
  function visibleTrig(d,code){return (d.trig&&d.trig.funds[code]||[]).filter(t=>{const s=sig(t.signal);return !(s&&s.sourceType==="外部观点"&&t.status!=="有效")})}
  function sigRate(s){if(!s||!s.research)return "";const n=(s.research.n||0)+(s.holdout?s.holdout.n:0),h=(s.research.hit||0)+(s.holdout?s.holdout.hit:0);return n?`历史 ${(h/n*100).toFixed(1)}%（${n} 次，基准 ${s.research.base??"–"}%）`:"暂无历史样本"}
  function checkReason(d,code,r,lockIso){
    const sv=(r.signals||[]).map(id=>{const t=(d.trig&&d.trig.funds[code]||[]).find(x=>x.signal===id);return {id,verdict:!t?"今天未触发":t.status!=="有效"?"历史不成立":"有效依据"}});
    const dv=(r.dataRefs||[]).map(id=>{const it=d.snap&&d.snap.items.find(i=>i.id===id);return {id,verdict:!it?"数据不在快照中":Date.parse(it.cutoff)<=Date.parse(lockIso)?"预测前已成立":"事后信息"}});
    return {signals:sv,data:dv};
  }
  function deadlineOf(T){return T+"T"+G.config.deadline+":00+08:00"}
  function lockState(d){
    if(d.user)return {k:"lock",text:"已锁定 🔒 "+hm(d.user.lockedAt)};
    if(Date.now()>Date.parse(deadlineOf(d.T)))return {k:"miss",text:"已截止 · 未提交"};
    return {k:"open",text:"待填写 · "+G.config.deadline+" 截止"};
  }

  // ---------- 预测 ----------
  function pickDay(){
    const days=Object.keys(G.index.days).sort();
    const t=todayBJ();
    return days.find(x=>x>=t&&!G.index.days[x].result)||days.filter(x=>!G.index.days[x].result).at(-1)||days.at(-1)||null;
  }
  async function renderPred(){
    const days=Object.keys(G.index.days).sort();
    if(!cur)cur=pickDay();
    if(!cur){$("v-pred").innerHTML='<div class="empty">还没有预测日。下一个交易日前一晚 22:13 系统会准备好数据。</div>';return}
    const d=await loadDay(cur), ls=lockState(d), i=days.indexOf(cur);
    let h='<div class="top"><div class="datenav"><button class="icon" data-nav="-1" aria-label="前一天"'+(i<=0?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><h1>'+esc(dlabel(cur))+'</h1><button class="icon" data-nav="1" aria-label="后一天"'+(i>=days.length-1?' disabled':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button></div><span class="pill p-'+ls.k+'">'+esc(ls.text)+'</span></div>';
    const u=d.user, res=d.result;
    const ov=u?u.overall&&u.overall.value:null;
    const act=res?avgActual(res):null;
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>科技仓</h2>'+(res?'<span class="sub small">实际 <b class="num '+cls(act)+'">'+fmt(act)+'</b></span>':'')+'</div>';
    if(u){h+='<span class="big '+cls(ov)+'">'+fmt(ov)+'</span>'+(u.overall&&u.overall.conclusion?'<span style="font-size:14px">'+esc(u.overall.conclusion)+'</span>':'')}
    else if(ls.k==="open"){h+='<span class="sub" style="font-size:14px;line-height:1.6">今天的预测还没填。参考数据、今天触发的规律和 AI 草稿后，给每只基金一个数值，'+esc(G.config.deadline)+' 前提交，提交即锁定。</span><button class="btn btn-p" id="go-form">填写今日预测</button>'}
    else h+='<span class="sub" style="font-size:14px">这一天没有提交预测，只统计基准和 AI 草稿的成绩。</span>';
    h+='</div>';
    h+='<div class="list">';
    for(const f of G.funds){
      const v=u&&u.funds[f.code]?u.funds[f.code].value:null, a=res?res.actual[f.code]:null, sc=res&&res.scores.user&&res.scores.user[f.code];
      const ref=!u&&d.ai&&d.ai.funds[f.code]?d.ai.funds[f.code].value:null;
      h+='<button class="row" data-fund="'+f.code+'"><span class="nm">'+esc(f.short)+'</span>'+
        (u?'<span class="v '+cls(v)+'">'+fmt(v)+'</span>':'<span class="v sub" style="font-size:14px;font-weight:500">'+(ref!=null?'草稿 '+fmt(ref):'–')+'</span>')+
        '<span class="a">'+(a!=null?'<span class="'+cls(a)+'">'+fmt(a)+'</span> '+(sc?(sc.hit?'<span class="hit">✓</span>':'<span class="miss">✗</span>'):''):'<span class="chev">›</span>')+'</span></button>';
    }
    h+='</div>';
    if(!tok&&ls.k==="open")h+='<p class="foot">第一次填写前，需要在「设置」里粘贴 GitHub 令牌，用来把预测锁定到仓库里。</p>';
    h+='<div style="display:flex;justify-content:flex-end"><button class="link" id="go-settings">设置</button></div>';
    $("v-pred").innerHTML=h;
    $("v-pred").querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{const k=days.indexOf(cur)+(+b.dataset.nav);if(days[k]){cur=days[k];renderPred()}}));
    $("v-pred").querySelectorAll("[data-fund]").forEach(b=>b.addEventListener("click",()=>openFund(d,b.dataset.fund)));
    const gf=$("go-form");if(gf)gf.addEventListener("click",()=>openForm(d));
    $("go-settings").addEventListener("click",openSettings);
  }
  function avgActual(res){const xs=G.funds.map(f=>res.actual[f.code]).filter(v=>v!=null);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null}

  // ---------- 单只基金详情 ----------
  async function openFund(d,code){
    const f=G.funds.find(x=>x.code===code), u=d.user&&d.user.funds[code], res=d.result, sc=res&&res.scores.user&&res.scores.user[code];
    const checks=(res&&res.userChecks&&res.userChecks[code])||(u&&d.user?(u.reasons||[]).map(r=>checkReason(d,code,r,d.user.lockedAt)):[]);
    let h=sheetHead(f.short);
    h+='<div class="card"><dl class="kv"><dt>预测值</dt><dd class="num '+cls(u&&u.value)+'" style="font-size:20px;font-weight:600">'+fmt(u&&u.value)+'</dd>'+
      '<dt>实际值</dt><dd class="num '+cls(res&&res.actual[code])+'">'+(res?fmt(res.actual[code]):'收盘后公布')+'</dd>'+
      (sc?'<dt>结果</dt><dd>'+(sc.hit?'<span class="hit">方向对 ✓</span>':'<span class="miss">方向错 ✗</span>')+'　误差 <span class="num">'+sc.absErr.toFixed(2)+'</span></dd>':'')+
      (d.user?'<dt>锁定</dt><dd class="num">'+esc(String(d.user.lockedAt).replace("T"," ").slice(0,16))+'</dd>':'')+'</dl>'+
      (u&&u.conclusion?'<div style="font-weight:600">结论：'+esc(u.conclusion)+'</div>':'')+'</div>';
    if(u&&(u.reasons||[]).length){
      h+='<div class="card"><h2>预测理由</h2><ol class="pts">'+u.reasons.map((r,i)=>{const c=checks[i]||{signals:[],data:[]};

    S.querySelectorAll("[data-unref]").forEach(el=>el.addEventListener("click",()=>{const[c,i,...rest]=el.dataset.unref.split(":");const id=rest.join(":");const a=draft.funds[c].reasons[i].dataRefs;a.splice(a.indexOf(id),1);sync();renderForm(d)}));

      sync();renderForm(d);toast("已带入 AI 草稿，请逐条确认或修改")});

  function parseV(s){const v=parseFloat(String(s).replace("%","").replace("＋","+").replace("－","-"));return Number.isFinite(v)?Math.round(v*100)/100:null}
  function reviewBeforeSubmit(d){
    const errs=[];const nowIso=bjNow().toISOString().slice(0,19)+"+08:00";
    const out={date:d.T,predictor:"user",createdAt:nowIso,lockedAt:nowIso,snapshot:d.batch?d.T+"/"+d.batch:null,dataCutoff:d.snap?d.snap.asOf:null,modelVersion:G.model?G.model.version:null,
      overall:{value:parseV(draft.overall.value),conclusion:draft.overall.conclusion.trim()},funds:{}};
    for(const f of G.funds){const x=draft.funds[f.code],v=parseV(x.value);if(v==null)errs.push(f.short+" 没填数值");
      out.funds[f.code]={value:v,reasons:x.reasons.filter(r=>r.text.trim()).map(r=>({text:r.text.trim(),signals:r.signals,dataRefs:r.dataRefs})),conclusion:x.conclusion.trim()}}
    if(out.overall.value==null)errs.push("科技仓整体没填数值");
    if(Date.now()>Date.parse(deadlineOf(d.T)))errs.push("已过 "+G.config.deadline+" 截止时间，提交会记为迟交，不计入正式成绩");
    let h=sheetHead("提交前检查");
    if(errs.length)h+='<div class="card">'+errs.map(e=>'<div class="t-bad tag" style="white-space:normal">'+esc(e)+'</div>').join('')+'</div>';
    let flagged=0;
    h+='<div class="card"><h2>依据检查</h2><span class="sub tiny">✅ 历史有效且今天触发　⚠️ 今天未触发　❌ 历史不成立 / 事后信息。有问题的依据也能提交，但会被记录，以后统计这类预测准不准。</span>';
    for(const f of G.funds){const x=out.funds[f.code];
      h+='<div class="small" style="border-top:1px solid var(--line);padding-top:8px"><b>'+esc(f.short)+'</b> <span class="num '+cls(x.value)+'">'+fmt(x.value)+'</span>'+
        (x.reasons.length?'<ol class="pts" style="font-size:13px">'+x.reasons.map(r=>{const c=checkReason(d,f.code,r,nowIso);if(c.signals.some(s=>s.verdict!=="有效依据")||c.data.some(s=>s.verdict==="事后信息"))flagged++;
          return '<li>'+esc(r.text)+'<div class="chips">'+c.signals.map(s=>'<span class="tag '+VERDICT[s.verdict]+'">'+esc(s.id+" "+s.verdict)+'</span>').join('')+c.data.map(s=>'<span class="tag '+VERDICT[s.verdict]+'">'+esc(dataName(d,s.id)+" · "+s.verdict)+'</span>').join('')+(!c.signals.length&&!c.data.length?'<span class="tag t-n">主观判断</span>':'')+'</div></li>'}).join('')+'</ol>':'<div class="sub">没有写理由</div>')+'</div>'}
    h+='</div>'+(flagged?'<div class="card t-warn" style="background:var(--warn-soft)">有 '+flagged+' 条依据未通过检查。可以返回修改，也可以照样提交。</div>':'');
    h+='<div style="display:flex;gap:10px"><button class="btn btn-g" id="back-form" style="flex:1">返回修改</button><button class="btn btn-p" id="submit" style="flex:2"'+(errs.some(e=>e.includes("没填"))?' disabled':'')+'>提交并锁定</button></div>';
    showSheet(h);

      if(r){out.lockedAt=r;localUser[d.T]=out;dayCache[d.T]=null;try{localStorage.removeItem("fd-draft-"+d.T)}catch(e){}closeSheet();toast("已锁定 🔒 "+hm(r));renderPred()}
      else{b.disabled=false;b.textContent="提交并锁定"}

  async function putFile(path,obj,msg,createOnly){
    const body={message:msg,content:btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,1)+"\n")))};
    try{
      const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`,{method:"PUT",headers:{authorization:"Bearer "+tok,accept:"application/vnd.github+json","content-type":"application/json"},body:JSON.stringify(body)});
      if(r.status===422&&createOnly){toast("这一天已经提交过，预测不能覆盖");return null}
      if(r.status===401||r.status===403){toast("令牌无效或没有写权限，请在设置里重新粘贴");return null}
      if(!r.ok){toast("提交失败："+r.status);return null}
      const x=await r.json();const t=x.commit&&x.commit.committer&&x.commit.committer.date;
      return t?new Date(Date.parse(t)+8*3600e3).toISOString().slice(0,19)+"+08:00":obj.createdAt;
    }catch(e){toast("网络错误，请稍后再试");return null}
  }

  // ---------- 成绩 ----------
  function renderScore(){
    const S=G.stats;
    if(!S){$("v-score").innerHTML='<div class="empty">暂无统计</div>';return}
    const P=S.predictors, me=P.user;
    const benches=["bench_us","bench_prev","bench_zero"];
    const bestB=benches.filter(b=>P[b].n).sort((a,b)=>P[a].mae-P[b].mae)[0];
    let vt,vs;
    if(!me.n){vt="还没有成绩";vs="提交第一份预测、收盘结算后开始统计。"}
    else if(me.n<100){vt="样本还少，先不下结论";vs="已有 "+me.n+" 条预测（"+S.days+" 个交易日）。至少攒到 100 条，再看是否显著优于基准。"}
    else{const vb=S.vsBench.user[bestB];const sig=vb&&vb.maeGain&&vb.maeGain.lo>0;
      vt=sig?"是，我的预测显著优于基准":"还不能证明优于基准";
      vs="和最好的基准「"+NAMES[bestB]+"」相比，误差平均"+(vb&&vb.maeGain?(vb.maeGain.mean>0?"小 ":"大 ")+Math.abs(vb.maeGain.mean).toFixed(2)+" 个百分点（95% 区间 "+vb.maeGain.lo.toFixed(2)+" ~ "+vb.maeGain.hi.toFixed(2)+"）":"–")+"。区间全部大于 0 才算真正超过。"}
    let h='<div class="top"><h1>成绩</h1><span class="sub small">'+S.days+' 个交易日</span></div>';
    h+='<div class="card"><span class="sub small">我的预测能力是否真正超过简单策略？</span><span class="verdict">'+esc(vt)+'</span><span style="font-size:13.5px;line-height:1.6">'+esc(vs)+'</span></div>';
    h+='<div class="card"><h2>同场比较</h2><div class="scroll"><table class="tbl"><thead><tr><th>预测方</th><th>方向命中</th><th>MAE</th><th>条数</th></tr></thead><tbody>'+
      ["user","bench_us","bench_prev","bench_zero","ai","model"].map(k=>{const x=P[k];return '<tr class="'+(k==="user"?"me":"")+'"><td class="t">'+NAMES[k]+'</td><td>'+(k==="bench_zero"?'<span class="sub">不判方向</span>':x.rate!=null?x.rate.toFixed(1)+'%':'–')+'</td><td>'+(x.mae!=null?x.mae.toFixed(2)+'%':'–')+'</td><td>'+x.n+'</td></tr>'}).join('')+
      '</tbody></table></div><span class="sub tiny" style="line-height:1.6">方向分三态：涨（&gt;+'+G.config.flatBand+'%）、跌（&lt;−'+G.config.flatBand+'%）、平。MAE＝|预测−实际| 的平均。</span></div>';
    const vb=S.vsBench.user||{};
    h+='<div class="card"><h2>相对基准的提升</h2><div class="scroll"><table class="tbl"><thead><tr><th>对比</th><th>MAE 改善</th><th>误差差 95% 区间</th><th>命中率差</th></tr></thead><tbody>'+
      benches.map(b=>{const x=vb[b]||{};const g=x.maeGain,hg=x.hitGain;return '<tr><td class="t">vs '+NAMES[b]+'</td><td style="color:var(--'+(x.maeImprovePct>0?'ok':x.maeImprovePct<0?'bad':'sub')+')">'+(x.maeImprovePct!=null?(x.maeImprovePct>0?'+':'')+x.maeImprovePct.toFixed(1)+'%':'–')+'</td><td>'+(g?g.lo.toFixed(2)+' ~ '+g.hi.toFixed(2):'样本不足')+'</td><td>'+(hg?(hg.mean>0?'+':'')+hg.mean.toFixed(1)+' 点':'–')+'</td></tr>'}).join('')+
      '</tbody></table></div><span class="sub tiny">MAE 改善为正＝比基准更准。误差差区间全部大于 0 才算显著。</span></div>';
    const rq=S.reasonQuality;
    if(rq&&(rq.clean.n||rq.flagged.n))h+='<div class="card"><h2>依据有问题的预测，是不是更不准？</h2><table class="tbl"><thead><tr><th>预测</th><th>条数</th><th>方向命中</th><th>MAE</th></tr></thead><tbody><tr><td class="t">依据都通过检查</td><td>'+rq.clean.n+'</td><td>'+(rq.clean.rate??'–')+'%</td><td>'+(rq.clean.mae??'–')+'</td></tr><tr><td class="t">含 ⚠️/❌ 依据</td><td>'+rq.flagged.n+'</td><td>'+(rq.flagged.rate??'–')+'%</td><td>'+(rq.flagged.mae??'–')+'</td></tr></tbody></table></div>';
    h+='<div class="card"><h2>分基金</h2><div class="scroll"><table class="tbl"><thead><tr><th>基金</th><th>我 命中</th><th>我 MAE</th><th>外盘 MAE</th></tr></thead><tbody>'+G.funds.map(f=>{const b=S.byFund[f.code];return '<tr><td class="t">'+esc(f.short)+'</td><td>'+(b.user.rate??'–')+(b.user.rate!=null?'%':'')+'</td><td>'+(b.user.mae??'–')+'</td><td>'+(b.bench_us.mae??'–')+'</td></tr>'}).join('')+'</tbody></table></div></div>';
    $("v-score").innerHTML=h+'<div id="ledger"></div>';
    renderLedger();
  }
  async function renderLedger(){
    const days=Object.keys(G.index.days).filter(d=>G.index.days[d].result).sort().reverse().slice(0,10);
    if(!days.length)return;
    let h='<div class="card"><h2>流水账</h2><div class="scroll"><table class="tbl"><thead><tr><th>日期</th><th style="text-align:left">基金</th><th>我</th><th>实际</th><th></th><th>误差</th></tr></thead><tbody>';
    for(const T of days){const r=dayCache[T]&&dayCache[T].result||await j(`data/results/${T}.json`);if(!r)continue;
      for(const f of G.funds){const s=r.scores.user&&r.scores.user[f.code];h+='<tr><td>'+T.slice(5)+'</td><td class="t">'+esc(f.short)+'</td><td class="'+cls(s&&s.pred)+'">'+(s?fmt(s.pred):'<span class="sub">'+esc(r.meta.user?r.meta.user.status:"")+'</span>')+'</td><td class="'+cls(r.actual[f.code])+'">'+fmt(r.actual[f.code])+'</td><td>'+(s?(s.hit?'<span class="hit">✓</span>':'<span class="miss">✗</span>'):'')+'</td><td>'+(s?s.absErr.toFixed(2):'')+'</td></tr>'}}
    $("ledger").innerHTML=h+'</tbody></table></div><span class="sub tiny">每条预测的锁定时间以仓库提交记录为准，事后无法修改。</span></div>';
  }

  // ---------- 实验室 ----------
  function renderLab(){
    const st=G.status||{}, sp=st.split||{};
    let h='<div class="top"><h1>实验室</h1><span class="sub small">规则模型 '+esc(G.model?G.model.version:"–")+'</span></div>';
    const R=G.stats||{};
    const board=(t,xs,good)=>'<div class="card"><h2>'+t+'</h2>'+(xs&&xs.length?'<ol class="pts">'+xs.map(x=>'<li><span>'+esc(x.name)+'</span> <span class="num" style="font-weight:600;color:var(--'+(good?'ok':'bad')+')">'+x.rate.toFixed(1)+'%</span> <span class="sub tiny">基准 '+x.base+'% · '+x.n+' 次 · '+esc(x.status)+'</span></li>').join('')+'</ol>':'<span class="sub small">'+(good?'还没有规律稳定跑赢基准。':'还没有规律明显低于基准。')+'</span>')+'</div>';
    h+=board("最可靠的规律",R.reliable,true)+board("最会骗人的规律",R.deceptive,false);
    h+='<div class="card"><h2>信号库</h2><span class="sub tiny" style="line-height:1.6">研究集 '+esc(sp.researchFrom||"")+' 起，留出集 '+esc(sp.holdoutFrom||"")+' 至 '+esc(sp.to||"")+'。规则修改只能参考研究集，留出集用来验证。</span>';
    const order={"有效":0,"待验证":1,"实验中":2,"失效":3,"淘汰":4};
    for(const s of [...G.signals].filter(s=>s.sourceType!=="外部观点"||s.status==="有效").sort((a,b)=>(order[a.status]-order[b.status])||a.id.localeCompare(b.id))){
      const r=s.research||{},o=s.holdout||{};
      h+='<details style="border-top:1px solid var(--line);padding-top:8px"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center"><span style="min-width:0"><b class="num">'+esc(s.id)+'</b> '+esc(s.name)+'</span><span class="tag '+(STATUS_TAG[s.status]||"t-n")+'">'+esc(s.status)+'</span></summary>'+
        '<table class="tbl" style="margin-top:6px"><thead><tr><th></th><th>样本</th><th>命中率</th><th>MAE</th><th>基准</th></tr></thead><tbody>'+
        '<tr><td class="t">研究集</td><td>'+(r.n??0)+'</td><td>'+(r.rate!=null?r.rate.toFixed(1)+'%':'–')+(r.lo!=null?'<div class="sub tiny">'+r.lo+'~'+r.hi+'</div>':'')+'</td><td>'+(r.mae??'–')+'</td><td>'+(r.base??'–')+'%</td></tr>'+
        '<tr><td class="t">留出集</td><td>'+(o.n??0)+'</td><td>'+(o.rate!=null?o.rate.toFixed(1)+'%':'–')+'</td><td>'+(o.mae??'–')+'</td><td>'+(o.base??'–')+'%</td></tr></tbody></table>'+
        '<div class="sub tiny">条件 <code class="num">'+esc(s.when)+'</code> → '+(s.vote>0?'看涨':'看跌')+(s.scope!=="*"?' · 仅 '+esc((G.funds.find(f=>f.code===s.scope)||{}).short||s.scope):'')+'</div>'+
        (s.statusHistory&&s.statusHistory.length>1?'<div class="sub tiny">'+s.statusHistory.slice(1).map(x=>esc(x.date+" "+x.from+"→"+x.to)).join("；")+'</div>':'')+'</details>';
    }
    h+='<span class="sub tiny" style="line-height:1.6">状态：实验中（样本&lt;'+G.config.minSamples+'）→ 待验证 → 有效（研究集区间下限高于基准且留出集确认）→ 失效 → 淘汰（失效满 '+G.config.retireAfter+' 个交易日）。</span></div>';
    const cl=[...(G.changelog||[])].reverse();
    h+='<div class="card"><h2>规则版本</h2>'+(cl.length?cl.map(c=>'<div style="border-top:1px solid var(--line);padding-top:8px;font-size:13.5px"><b>'+esc(c.version)+'</b> <span class="tag '+(c.passed?'t-ok':'t-bad')+'">'+esc(c.status)+'</span> <span class="sub tiny">'+esc(String(c.createdAt).slice(0,10))+'</span><div>'+esc(c.change)+'</div>'+
      (c.research&&c.research.old?'<table class="tbl"><thead><tr><th></th><th>命中 旧→新</th><th>MAE 旧→新</th></tr></thead><tbody><tr><td class="t">研究集</td><td>'+c.research.old.rate+'→'+c.research.new.rate+'</td><td>'+c.research.old.mae+'→'+c.research.new.mae+'</td></tr><tr><td class="t">留出集</td><td>'+c.holdout.old.rate+'→'+c.holdout.new.rate+'</td><td>'+c.holdout.old.mae+'→'+c.holdout.new.mae+'</td></tr></tbody></table>':
       (c.research&&c.research.new?'<div class="sub tiny">研究集 命中 '+c.research.new.rate+'%、MAE '+c.research.new.mae+'；留出集 命中 '+c.holdout.new.rate+'%、MAE '+c.holdout.new.mae+'</div>':''))+'</div>').join(''):'<span class="sub small">暂无</span>')+'</div>';
    $("v-lab").innerHTML=h;
  }

  // ---------- 框架 ----------
  function show(v){document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));["pred","score","lab"].forEach(k=>$("v-"+k).hidden=k!==v);window.scrollTo(0,0);try{localStorage.setItem("fd-v",v)}catch(e){}}
  document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
  try{const v=localStorage.getItem("fd-v");if(v&&$("v-"+v))show(v)}catch(e){}
  async function load(){
    const [config,funds,index,signals,stats,changelog,status,model]=await Promise.all(["config","funds","index","signals","stats","models/changelog","status","models/current"].map(n=>j(`data/${n}.json`)));
    if(!config||!funds||!index){$("v-pred").innerHTML='<div class="empty">数据读取失败，请稍后再打开。</div>';return}
    G={config,funds:[...funds].sort((a,b)=>(a.order||0)-(b.order||0)),index,signals:signals||[],stats,changelog:changelog||[],status,model};
    dayCache={};
    await renderPred();renderScore();renderLab();
    $("foot").textContent=(status&&status.lastRun?'数据更新于 '+String(status.lastRun).replace("T"," ").slice(0,16)+' · ':'')+'每晚 22:13 结算并准备下一交易日数据，交易日 08:07 补充隔夜美股，'+config.deadline+' 截止填写。仅作实验记录，不构成投资建议。';
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$("sheet").hidden)load()});
  load();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
